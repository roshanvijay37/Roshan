<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>StatusHD How-To</title>
<style>
  :root { --bg:#0a0c0f; --fg:#eef1f4; --muted:#9aa4ae; --green:#25d366; --card:#14181d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:28px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 28px; }
  h2 { font-size:20px; margin:36px 0 14px; display:flex; align-items:center; gap:10px; }
  h2 span { background:var(--green); color:#062010; font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  a.card { display:block; background:var(--card); border-radius:14px; overflow:hidden; }
  a.card img { display:block; width:100%; height:auto; }
  .hint { color:var(--muted); font-size:14px; margin-top:28px; }
  .vids { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .vids figure { margin:0; background:var(--card); border-radius:14px; overflow:hidden; }
  .vids video { display:block; width:100%; height:auto; background:#000; }
  .vids figcaption { padding:10px 14px; font-size:14px; color:var(--muted); }
  .vids a { color:var(--green); }
</style>
</head>
<body>
<main>
  <h1>How to use StatusHD</h1>
  <p class="lead">Five steps, taken from the videos on statushd.in. Tap any image to open it full size.</p>

  <h2>Send a video as a Document <span>short videos</span></h2>
  <div class="vids">
    <figure><video src="android-send-as-document.mp4" controls playsinline preload="metadata"></video><figcaption>Android, 27 s · <a href="android-send-as-document.mp4" download>Download</a></figcaption></figure>
    <figure><video src="iphone-send-as-document.mp4" controls playsinline preload="metadata"></video><figcaption>iPhone, 23 s · <a href="iphone-send-as-document.mp4" download>Download</a></figcaption></figure>
  </div>

  <h2>Android <span>5 steps</span></h2>
  <div class="grid">
    <a class="card" href="android/step1.jpg"><img src="android/step1.jpg" alt="Step 1: tap the clip icon, then Document" loading="lazy"></a>
    <a class="card" href="android/step2.jpg"><img src="android/step2.jpg" alt="Step 2: pick your original video" loading="lazy"></a>
    <a class="card" href="android/step3.jpg"><img src="android/step3.jpg" alt="Step 3: send it to StatusHD" loading="lazy"></a>
    <a class="card" href="android/step4.jpg"><img src="android/step4.jpg" alt="Step 4: your HD video comes back" loading="lazy"></a>
    <a class="card" href="android/step5.jpg"><img src="android/step5.jpg" alt="Step 5: forward it to My status" loading="lazy"></a>
  </div>

  <h2>iPhone <span>5 steps</span></h2>
  <div class="grid">
    <a class="card" href="iphone/step1.jpg"><img src="iphone/step1.jpg" alt="Step 1: tap +, then Document" loading="lazy"></a>
    <a class="card" href="iphone/step2.jpg"><img src="iphone/step2.jpg" alt="Step 2: tap Choose photo or video" loading="lazy"></a>
    <a class="card" href="iphone/step3.jpg"><img src="iphone/step3.jpg" alt="Step 3: pick your video and tap Send" loading="lazy"></a>
    <a class="card" href="iphone/step4.jpg"><img src="iphone/step4.jpg" alt="Step 4: your HD video comes back" loading="lazy"></a>
    <a class="card" href="iphone/step5.jpg"><img src="iphone/step5.jpg" alt="Step 5: forward it to My status" loading="lazy"></a>
  </div>

  <p class="hint">Each image is 1080 × 1920, sized for WhatsApp Status and Instagram Stories.</p>
</main>
</body>
</html>
