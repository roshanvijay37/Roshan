<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dl</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<link rel="icon" href="/icon-192.png">
<style>
  :root { --bg: #fafafa; --fg: #111; --dim: #888; --line: #e4e4e4; --soft: #f0f0f0; --err: #c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #eee; --dim: #777; --line: #262626; --soft: #1c1c1c; --err: #ff6b5b; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body { font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px 40px; transition: padding-top .25s ease; }
  /* Nothing looked up yet: the box sits in the middle of the screen; results move it to the top. */
  main:has(#items:empty) { padding-top: calc(50vh - 60px); padding-top: calc(50dvh - 60px); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  form { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); height: 60px; padding: 0 6px 0 16px; font-size: 17px; }
  form svg { width: 21px; height: 21px; }
  form #s { width: 21px; }
  form .ib { width: 46px; height: 46px; border-radius: 10px; }
  form:focus-within { border-color: var(--dim); }
  #s { width: 18px; flex: none; color: var(--dim); }
  #s.youtube { color: #f00; } #s.instagram { color: #d62976; }
  input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--fg); font: inherit; padding: 0 10px; }
  input::placeholder { color: var(--dim); }
  .ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; color: var(--dim); flex: none; }
  .ib:active { background: var(--soft); }
  #go { color: var(--fg); }
  #go:disabled { opacity: .4; }
  #x { display: none; } form.has #x { display: grid; } form.has #p { display: none; }

  .top { display: flex; gap: 8px; align-items: center; }
  .top form { flex: 1; min-width: 0; }
  #wa { flex: none; width: 60px; height: 60px; border-radius: 14px; border: 1px solid var(--line); display: grid; place-items: center; color: #25d366; }
  #wa[hidden] { display: none; }
  #wa svg { width: 26px; height: 26px; stroke-width: 2.2; }
  #wa:active { background: var(--soft); }
  #clip { display: flex; align-items: center; gap: 8px; max-width: 100%; margin: 12px auto 0; height: 36px; padding: 0 14px;
          border: 1px solid var(--line); border-radius: 18px; font-size: 13px; color: var(--dim); }
  #clip[hidden] { display: none; }
  #clip .ct { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #clip svg { width: 16px; height: 16px; flex: none; }
  .ci.youtube { color: #f00; } .ci.instagram { color: #d62976; }
  #s.facebook, .ci.facebook { color: #1877f2; } #s.pinterest, .ci.pinterest { color: #e60023; } #s.reddit, .ci.reddit { color: #ff4500; }
  #s.linkedin, .ci.linkedin { color: #0a66c2; } #s.snapchat, .ci.snapchat { color: #e6b800; } #s.x, .ci.x { color: var(--fg); }
  #m { min-height: 20px; margin: 10px 2px 0; font-size: 13px; color: var(--err); }

  .row { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .th { flex: none; width: 128px; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; background: var(--soft); position: relative; }
  .th.tall { width: 72px; aspect-ratio: 9/16; }
  .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .th span { position: absolute; right: 4px; bottom: 4px; font-size: 11px; background: rgba(0,0,0,.7); color: #fff; padding: 0 4px; border-radius: 3px; font-variant-numeric: tabular-nums; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .t { font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .d { color: var(--dim); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .a { display: flex; gap: 6px; margin-top: auto; padding-top: 10px; align-items: center; }
  .b { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .b.p { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .b svg { width: 15px; height: 15px; }
  .b:active { opacity: .7; }
  .ok { font-size: 13px; color: var(--dim); display: inline-flex; align-items: center; gap: 4px; margin-right: auto; font-variant-numeric: tabular-nums; }
  .ok svg { width: 15px; height: 15px; color: #2a9d55; stroke-width: 3; }

  .pg { margin-top: auto; padding-top: 10px; }
  .bar { height: 3px; background: var(--soft); border-radius: 2px; overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--fg); transition: width .2s linear; }
  .bar.ind i { width: 30%; animation: ind 1s ease-in-out infinite; }
  @keyframes ind { from { left: -30%; } to { left: 100%; } }
  .st { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--dim); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .st button { font-size: 12px; color: var(--dim); text-decoration: underline; }

  .sk { height: 96px; border-radius: 6px; background: var(--soft); animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity: .4; } }
</style>
</head>
<body>
<main>
  <div class="top">
  <form id="f" autocomplete="off">
    <span id="s"></span>
    <input id="u" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="Link" aria-label="Link">
    <button type="button" class="ib" id="p" aria-label="Paste"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg></button>
    <button type="button" class="ib" id="x" aria-label="Clear"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="ib" id="go" aria-label="Go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
  <!-- Android app only: the WhatsApp status saver (native screen). -->
  <button type="button" id="wa" aria-label="Statuses" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="4.2 2.4"/><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/></svg></button>
  </div>
  <button type="button" id="clip" hidden></button>
  <p id="m" role="status"></p>
  <div id="items"></div>
</main>

<script>
  const API = "https://ig.roshanvijay.com";
  const $ = (id) => document.getElementById(id);
  const msg = (t) => { $("m").textContent = t || ""; };
  const I = {
    down: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
    note: '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
    share: '<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M20 14v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5"/></svg>',
    tick: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>',
    instagram: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>',
    link: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
  };
  const mb = (n) => (n / 1048576).toFixed(n >= 10485760 ? 0 : 1) + " MB";
  const clock = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  let current = null;                                   // the AbortController of a running download
  // Inside the Android app (Workk/saver-android) the page hands downloads to the app, which
  // saves straight to the gallery. The Play build of the app is Instagram only.
  const APP = window.SaverApp || null;
  const SITES = APP ? APP.sites().split(",") : ["youtube", "instagram", "facebook", "x", "pinterest", "reddit", "snapchat", "linkedin"];
  const NAMES = { youtube: "YouTube", instagram: "Instagram", facebook: "Facebook", x: "X", pinterest: "Pinterest",
                  reddit: "Reddit", snapchat: "Snapchat", linkedin: "LinkedIn" };
  const progText = (got, total, secs) => {
    const rate = got / Math.max(secs, .001);
    return total ? mb(got) + " / " + mb(total) + (secs > 1 ? " · " + mb(rate) + "/s · " + clock((total - got) / rate) : "")
                 : mb(got) + (secs > 1 ? " · " + mb(rate) + "/s" : "");
  };

  // Which site a link is from - decided here as you type, and again by the server.
  // Same sites as the server's OTHER list (Workk/igdl/server.py); order matters - YouTube and Instagram first.
  const SITE_RE = {
    youtube: /^(?:https?:\/\/)?(?:www\.|m\.|music\.)?(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)[\w-]{11}/i,
    instagram: /^(?:https?:\/\/)?(?:www\.)?instagram\.com\/(?:[\w.]+\/)?(?:reel|reels|p|tv)\/[\w-]{5,}/i,
    facebook: /^(?:https?:\/\/)?(?:[\w-]+\.)?(?:facebook\.com|fb\.watch|fb\.com)\/\S+/i,
    x: /^(?:https?:\/\/)?(?:www\.|mobile\.)?(?:x\.com|twitter\.com)\/\S+/i,
    pinterest: /^(?:https?:\/\/)?(?:[\w-]+\.)?(?:pinterest\.[a-z.]+|pin\.it)\/\S+/i,
    reddit: /^(?:https?:\/\/)?(?:[\w-]+\.)?(?:reddit\.com|redd\.it)\/\S+/i,
    snapchat: /^(?:https?:\/\/)?(?:www\.)?snapchat\.com\/\S+/i,
    linkedin: /^(?:https?:\/\/)?(?:[\w-]+\.)?linkedin\.com\/\S+/i,
  };
  const siteOf = (u) => Object.keys(SITE_RE).find((k) => SITE_RE[k].test(u)) || "";
  const allowed = (u) => SITES.includes(siteOf(u));
  // A pasted share text ("Check this out https://youtu.be/...") - take the link out of it.
  const linkIn = (t) => { const m = t.match(/https?:\/\/\S+/); return m && !siteOf(t) ? m[0] : t; };

  function hint() {
    const v = $("u").value.trim(), l = linkIn(v), s = allowed(l) ? siteOf(l) : "";
    $("s").className = s; $("s").innerHTML = I[s] || I.link;
    $("f").classList.toggle("has", !!v);
  }
  $("u").addEventListener("input", () => { hint(); $("clip").hidden = true; });

  // The app noticed a link on the clipboard: offer it under the box, one tap to look it up.
  let clipLink = "";
  window.saverClip = (link) => {
    if (!allowed(link) || link === $("u").value.trim()) return;
    clipLink = link;
    const s = siteOf(link), c = $("clip");
    c.innerHTML = '<span class="ci ' + s + '">' + (I[s] || I.link) + '</span><span class="ct"></span>';
    c.querySelector(".ct").textContent = link.replace(/^https?:\/\/(www\.)?/i, "");
    c.hidden = false;
  };
  $("clip").addEventListener("click", () => { $("clip").hidden = true; $("u").value = clipLink; hint(); $("f").requestSubmit(); });
  $("u").addEventListener("paste", () => setTimeout(() => { hint(); if (allowed(linkIn($("u").value.trim()))) $("f").requestSubmit(); }));
  hint();

  $("p").addEventListener("click", async () => {
    try { $("u").value = (APP ? APP.clipboard() : await navigator.clipboard.readText()).trim(); hint(); if ($("u").value) $("f").requestSubmit(); }
    catch (e) { $("u").focus(); }
  });
  function clearAll() {
    if (current) current.abort();
    $("u").value = ""; $("items").innerHTML = ""; msg(""); hint();
  }
  $("x").addEventListener("click", () => { clearAll(); $("u").focus(); });

  function filenameFrom(r, fallback) {
    const m = /filename="?([^";]+)"?/i.exec(r.headers.get("Content-Disposition") || "");
    return (m && m[1]) || fallback;
  }

  // Fetch the file ourselves: that gives a real progress bar, and a same-origin blob is SAVED by
  // phones instead of opened and played in a new tab (what a plain cross-site link does).
  async function download(row, job) {
    if (APP) return nativeDownload(row, job);
    if (current) current.abort();
    const ctl = current = new AbortController();
    const a = row.querySelector(".a");
    a.hidden = true;
    const pg = document.createElement("div"); pg.className = "pg";
    pg.innerHTML = '<div class="bar ind"><i></i></div><div class="st"><span></span><button type="button">cancel</button></div>';
    row.querySelector(".info").append(pg);
    const bar = pg.querySelector(".bar"), fill = bar.querySelector("i"), st = pg.querySelector("span");
    pg.querySelector("button").onclick = () => ctl.abort();
    st.textContent = job.audio ? "MP3…" : "MP4…";
    msg("");
    try {
      const r = await fetch(job.href, { signal: ctl.signal });
      if (!r.ok) {
        let e = "Failed";
        try { e = (await r.json()).error || e; } catch (x) {}
        throw new Error(e);
      }
      const total = +r.headers.get("Content-Length") || 0;
      const name = filenameFrom(r, job.name), type = r.headers.get("Content-Type") || "video/mp4";
      const reader = r.body.getReader(), parts = [], t0 = performance.now();
      let got = 0;
      if (total) bar.classList.remove("ind");
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        if (total) fill.style.width = Math.min(100, got / total * 100).toFixed(1) + "%";
        st.textContent = progText(got, total, (performance.now() - t0) / 1000);
      }
      const file = new File(parts, name, { type });
      save(file);
      pg.remove(); finish(row, file, job);
    } catch (err) {
      pg.remove(); restore(row);
      if (err.name !== "AbortError") msg(err.message && err.message !== "Failed to fetch" ? err.message : "Server offline");
    } finally { if (current === ctl) current = null; }
  }

  // --- Android app: the app downloads and saves; the page only shows progress ---
  const nat = {};                                       // id -> { row, job, pg, t0 } while the app downloads
  let seq = 0;
  function nativeDownload(row, job) {
    const id = "d" + (++seq) + "_" + Date.now();
    const a = row.querySelector(".a"); a.hidden = true;
    const pg = document.createElement("div"); pg.className = "pg";
    pg.innerHTML = '<div class="bar ind"><i></i></div><div class="st"><span></span><button type="button">cancel</button></div>';
    row.querySelector(".info").append(pg);
    pg.querySelector("span").textContent = job.audio ? "MP3…" : "MP4…";
    pg.querySelector("button").onclick = () => APP.cancel(id);
    nat[id] = { row, job, pg, t0: 0 };
    msg("");
    APP.download(id, job.href, job.name, job.audio);
  }
  window.saverEvent = (id, type, a, b, text) => {
    const d = nat[id]; if (!d) return;
    if (type !== "progress" && type !== "done" && type !== "error" && type !== "cancelled") return;   // queued, begin, idle
    if (type === "progress") {
      if (!d.t0) d.t0 = performance.now();
      const bar = d.pg.querySelector(".bar");
      if (b) { bar.classList.remove("ind"); bar.querySelector("i").style.width = Math.min(100, a / b * 100).toFixed(1) + "%"; }
      d.pg.querySelector("span").textContent = progText(a, b, (performance.now() - d.t0) / 1000);
      return;
    }
    delete nat[id]; d.pg.remove();
    if (type === "done") finishNative(d.row, d.job, id, a);
    else { restore(d.row); if (type === "error") msg(text); }
  };
  function finishNative(row, job, id, size) {
    const a = row.querySelector(".a"); a.innerHTML = ""; a.hidden = false;
    const ok = document.createElement("span"); ok.className = "ok"; ok.innerHTML = I.tick + mb(size); a.append(ok);
    a.append(btn(I.play, "b p", () => APP.open(id), "Open"));
    a.append(btn(I.share, "b", () => APP.share(id), "Share"));
    const other = row.jobs.find((j) => j !== job);
    if (other) a.append(btn(other.audio ? I.note + "MP3" : I.down + "MP4", "b", () => download(row, other)));
  }
  // Back button: clear the result first; let the app leave when there is nothing to clear.
  window.saverBack = () => {
    if (Object.keys(nat).length) return false;
    if ($("items").children.length || $("u").value || $("m").textContent) { clearAll(); $("u").blur(); return true; }
    return false;
  };
  if (APP && typeof APP.statuses === "function") {
    $("wa").hidden = false;
    // Saver+ (personal, never on Play) shows WhatsApp's own logo; the Play build keeps the plain ring (trademark).
    if (SITES.includes("youtube")) $("wa").innerHTML = I.whatsapp;
    $("wa").addEventListener("click", () => APP.statuses());
  }
  // A link shared into the app while it is open.
  window.saverOpen = (link) => { $("u").value = link; hint(); $("f").requestSubmit(); };

  function save(file) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = file.name; a.style.display = "none";
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
  }

  const btn = (html, cls, fn, label) => {
    const b = document.createElement("button"); b.type = "button"; b.className = cls; b.innerHTML = html; b.onclick = fn;
    if (label) b.setAttribute("aria-label", label);
    return b;
  };

  function finish(row, file, job) {
    const a = row.querySelector(".a"); a.innerHTML = ""; a.hidden = false;
    const ok = document.createElement("span"); ok.className = "ok"; ok.innerHTML = I.tick + mb(file.size); a.append(ok);
    // Phones: the share sheet has "Save video" / gallery apps. Needs a fresh tap.
    if (navigator.canShare && navigator.canShare({ files: [file] }))
      a.append(btn(I.share, "b p", () => navigator.share({ files: [file] }).catch(() => {}), "Save to gallery"));
    a.append(btn(I.down, "b", () => save(file), "Save again"));
    const other = row.jobs.find((j) => j !== job);
    if (other) a.append(btn(other.audio ? I.note + "MP3" : I.down + "MP4", "b", () => download(row, other)));
  }

  function restore(row) {
    const a = row.querySelector(".a"); a.innerHTML = ""; a.hidden = false;
    for (const job of row.jobs)
      a.append(btn(job.audio ? I.note + "MP3" : I.down + "MP4", job.audio ? "b" : "b p", () => download(row, job)));
  }

  function row(d, it, url, many) {
    const ig = (d.site || "instagram") === "instagram";
    const tall = it.width && it.height ? it.height > it.width : ig;
    const el = document.createElement("div"); el.className = "row";
    const th = document.createElement("div"); th.className = "th" + (tall ? " tall" : "");
    if (it.thumb) {
      const img = document.createElement("img"); img.alt = ""; img.referrerPolicy = "no-referrer"; img.src = it.thumb;
      img.onerror = () => img.remove(); th.append(img);
    }
    if (it.duration) { const s = document.createElement("span"); s.textContent = clock(it.duration); th.append(s); }
    const info = document.createElement("div"); info.className = "info";
    const t = document.createElement("div"); t.className = "t";
    t.textContent = (ig ? (d.uploader ? "@" + d.uploader.replace(/^@/, "") : "") : d.caption) || NAMES[d.site] || "Video";
    const bits = [];
    if (!ig && d.uploader) bits.push(d.uploader);
    const h = Math.min(it.width || 0, it.height || 0);
    if (h) bits.push(h + "p");
    if (it.size) bits.push(mb(it.size));
    if (many) bits.push((it.i + 1) + "/" + many);
    const dd = document.createElement("div"); dd.className = "d"; dd.textContent = bits.join(" · ");
    const a = document.createElement("div"); a.className = "a";
    info.append(t, dd, a);
    el.append(th, info);
    const q = "?url=" + encodeURIComponent(url) + "&i=" + it.i, stem = (d.site || "instagram") + "_" + (d.code || "video") + (many ? "_" + (it.i + 1) : "");
    el.jobs = [{ href: API + "/api/dl" + q, name: stem + ".mp4", audio: false }];
    if (it.has_audio) el.jobs.push({ href: API + "/api/audio" + q, name: stem + ".mp3", audio: true });
    restore(el);
    return el;
  }

  async function lookup(url) {
    if (current) current.abort();
    $("items").innerHTML = '<div class="sk"></div>'; msg("");
    $("go").disabled = true;
    try {
      const r = await fetch(API + "/api/info?url=" + encodeURIComponent(url));
      const d = await r.json();
      $("items").innerHTML = "";
      if (!r.ok) { msg(d.error || "Failed"); return; }
      if (!d.items || !d.items.length) { msg("No video"); return; }
      const many = d.items.length > 1 ? d.items.length : 0;
      for (const it of d.items) $("items").append(row(d, it, url, many));
    } catch (err) {
      $("items").innerHTML = ""; msg("Server offline");
    } finally { $("go").disabled = false; }
  }

  $("f").addEventListener("submit", (e) => {
    e.preventDefault();
    let url = linkIn($("u").value.trim());
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    $("clip").hidden = true;
    if (!allowed(url)) {
      $("items").innerHTML = "";
      msg(SITES.length > 1 ? "Not a supported link" : "Instagram links only");
      return;
    }
    $("u").value = url; hint(); $("u").blur();
    lookup(url);
  });

  // ?url= links (e.g. from a share sheet) look the video up straight away
  try { const q = new URLSearchParams(location.search).get("url"); if (q) { $("u").value = q; hint(); $("f").requestSubmit(); } } catch (e) {}
</script>
