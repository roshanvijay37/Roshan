<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D69 — Floors</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--shaft:#e4dece}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--shaft:#16130d}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:"Space Grotesk",system-ui,sans-serif}
/* A building. Each project is a floor, and a fixed panel on the left shows
   which one you are on — the indicator does the navigation. */
.lift{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:50;background:var(--shaft);
  border:1px solid var(--line);border-radius:10px;padding:9px 7px;display:grid;gap:5px}
@media(max-width:700px){.lift{left:8px;padding:7px 5px}}
.lift button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:none;color:var(--dim);
  font:inherit;font-size:11px;font-family:"DM Mono",monospace;cursor:pointer}
.lift button.on{background:var(--c);color:#fff;border-color:transparent}
.floor{min-height:100svh;display:grid;align-content:center;padding:16vh 0 10vh 52px;border-bottom:1px solid var(--line)}
@media(min-width:760px){.floor{padding-left:74px}}
.floor .no{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.floor h2{font-weight:700;font-size:clamp(30px,8vw,86px);letter-spacing:-.045em;line-height:1;margin:11px 0 14px}
.floor p{color:var(--dim);font-size:15.5px;line-height:1.74;max-width:52ch}
.floor .band{height:8px;background:var(--c);margin:18px 0;max-width:340px}
.floor .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.floor .st span{font-size:10px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--dim)}
.floor a{display:inline-block;margin-top:16px;background:var(--ink);color:var(--bg);text-decoration:none;
  padding:13px 19px;border-radius:99px;font-weight:600;font-size:13.5px}
.hero{padding-left:52px}
@media(min-width:760px){.hero{padding-left:74px}}
.pad{padding-left:0}
.sec{padding-left:52px}
@media(min-width:760px){.sec{padding-left:74px}}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="lift" id="lift"></div><div class="pad"><section class="hero"><h1>Five floors.</h1><p id="intro"></p></section>
 <div id="floors"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
floors.innerHTML=S.projects.map((p,i)=>`<section class="floor" id="f${i}" style="--c:${p.c}">
  <div class="no mono">Floor ${String(i+1).padStart(2,"0")} — ${p.type}</div>
  <h2>${p.t}</h2><div class="band"></div><p>${p.s}</p>
  <div class="st">${p.stack.map(x=>`<span class="mono">${x}</span>`).join("")}</div>
  <a href="${p.href}" target="_blank" rel="noreferrer">Visit live site ↗</a></section>`).join("");
lift.innerHTML=S.projects.map((p,i)=>`<button data-i="${i}" style="--c:${p.c}">${i+1}</button>`).join("");
lift.querySelectorAll("button").forEach(b=>b.onclick=()=>document.getElementById("f"+b.dataset.i).scrollIntoView({behavior:"smooth"}));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
  const i=+e.target.id.slice(1);
  lift.querySelectorAll("button").forEach((b,n)=>b.classList.toggle("on",n===i));}}),{threshold:.5});
document.querySelectorAll(".floor").forEach(f=>io.observe(f));
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d69t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("69");
</script></body></html>
