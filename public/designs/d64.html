<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D64 — Layers</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif}
/* Depth built from stacked planes moving at different rates — the oldest trick
   in the book, done properly with transform rather than background-position. */
.scene{position:relative;height:78svh;overflow:hidden;border-radius:16px;border:1px solid var(--line);margin-top:4vh}
.layer{position:absolute;inset:-12% -6%;will-change:transform}
.l1{background:radial-gradient(60% 50% at 24% 30%,var(--c1),transparent 62%)}
.l2{background:radial-gradient(52% 44% at 76% 62%,var(--c2),transparent 60%)}
.l3{background:radial-gradient(44% 38% at 46% 84%,var(--c3),transparent 62%)}
.scene .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
.scene .mid h2{font-weight:800;font-size:clamp(28px,7vw,74px);letter-spacing:-.045em;line-height:1}
.scene .mid p{margin-top:12px;color:var(--dim);font-size:14.5px;max-width:40ch}
.list{margin-top:6vh}
.row{display:grid;gap:14px;border-top:1px solid var(--line);padding:24px 0;text-decoration:none;color:inherit}
@media(min-width:820px){.row{grid-template-columns:1fr 1fr;gap:34px;align-items:center}}
.row .card{aspect-ratio:16/10;border-radius:12px;background:var(--c);display:grid;place-items:center;position:relative;overflow:hidden}
.row .card b{color:rgba(255,255,255,.96);font-weight:800;font-size:clamp(20px,4vw,34px);letter-spacing:-.03em}
.row .card .sh{position:absolute;inset:0;background:radial-gradient(50% 60% at 30% 20%,rgba(255,255,255,.32),transparent 60%);will-change:transform}
.row h3{font-weight:800;font-size:clamp(21px,4.2vw,34px);letter-spacing:-.035em}
.row .k{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.row p{color:var(--dim);font-size:14px;line-height:1.68;margin-top:9px}
@media(prefers-reduced-motion:reduce){.layer,.sh{transform:none!important}}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Depth,<br>done honestly.</h1><p id="intro"></p></section>
 <div class="scene" id="scene">
  <div class="layer l1" style="--c1:#e6c374"></div><div class="layer l2" style="--c2:#c2610c"></div>
  <div class="layer l3" style="--c3:#2f9e6e"></div>
  <div class="mid"><div><h2>Five live sites</h2><p>Move your cursor, or scroll.</p></div></div></div>
 <div class="list" id="list"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
list.innerHTML=S.projects.map(p=>`<a class="row" href="${p.href}" target="_blank" rel="noreferrer">
  <div class="card" style="--c:${p.c}"><span class="sh"></span><b>${p.t}</b></div>
  <div><div class="k mono">${p.type}</div><h3>${p.t}</h3><p>${p.s}</p></div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const ls=[...document.querySelectorAll(".layer")],shs=[...document.querySelectorAll(".sh")];
let px=0,py=0,tx2=0,ty2=0;
addEventListener("pointermove",e=>{tx2=(e.clientX/innerWidth-.5)*2;ty2=(e.clientY/innerHeight-.5)*2},{passive:true});
(function loop(){px+=(tx2-px)*.06;py+=(ty2-py)*.06;
  const y=scrollY;
  ls.forEach((l,i)=>{const d=(i+1)*.5;
    l.style.transform=`translate3d(${(-px*22*d).toFixed(1)}px,${(-py*18*d+y*.04*d).toFixed(1)}px,0)`;});
  shs.forEach(s=>s.style.transform=`translate3d(${(px*26).toFixed(1)}px,${(py*20).toFixed(1)}px,0)`);
  requestAnimationFrame(loop);})();
const root = document.documentElement;
const KEY = "d64t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("64");
</script></body></html>
