<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D27 — Coverflow</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;900&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b08;--ink:#f1ebdc;--gold:#e6c374;--dim:#8f8877;--line:rgba(241,235,220,.14)}
:root[data-theme="light"]{--bg:#f7f4ea;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.14)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}
nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:16px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;border-radius:99px;padding:7px 12px;cursor:pointer}
.hero{padding:19vh 0 4vh}
.hero .k{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.hero h1{font-weight:900;font-size:clamp(38px,10vw,120px);line-height:.94;letter-spacing:-.05em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin-top:22px;max-width:46ch;color:var(--dim);line-height:1.78;font-size:15.5px}
/* A stack seen at an angle: the focused card is upright and the ones behind it
   recede and tilt. Scroll drives it, so it never runs on its own. */
.flowwrap{height:230vh;position:relative}
.flow{position:sticky;top:0;height:100svh;display:grid;place-items:center;perspective:1500px;overflow:hidden}
.deck{position:relative;width:min(84vw,460px);height:min(58vh,430px);transform-style:preserve-3d}
.cd{position:absolute;inset:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:var(--bg);box-shadow:0 30px 70px rgba(0,0,0,.4);will-change:transform,opacity;
  text-decoration:none;color:inherit;display:flex;flex-direction:column}
.cd .face{flex:1;background:var(--c);display:grid;place-items:center;padding:20px;position:relative}
.cd .face b{color:rgba(255,255,255,.96);font-weight:900;font-size:clamp(24px,5.6vw,44px);letter-spacing:-.04em;text-align:center;line-height:1.04}
.cd .face .k{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.76)}
.cd .body{padding:14px 16px 18px;border-top:1px solid var(--line)}
.cd .body p{color:var(--dim);font-size:13px;line-height:1.6}
.cd .body .st{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.cd .body .st span{font-size:9.5px;border:1px solid var(--line);padding:5px 7px;border-radius:99px;color:var(--dim)}
.cd .body .go{display:block;margin-top:10px;color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.rail{position:absolute;bottom:6vh;left:50%;transform:translateX(-50%);display:flex;gap:7px}
.rail i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.3s}
.rail i.on{background:var(--gold);transform:scale(1.5)}
.sec{padding:10vh 0}
.lab{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.sec h2{font-weight:900;font-size:clamp(26px,5.6vw,58px);letter-spacing:-.04em}
.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:16px 0 20px}
.sv h4{font-weight:700;font-size:19px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.68;margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4vh}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:8px 10px;border-radius:99px;color:var(--dim)}
.cta{padding:9vh 0 14vh;text-align:center}
.btn{display:inline-block;margin-top:22px;background:var(--gold);color:#130f06;text-decoration:none;padding:16px 24px;border-radius:99px;font-weight:700;font-size:14px}
@media(prefers-reduced-motion:reduce){.flowwrap{height:auto}.flow{position:static;height:auto;padding:4vh 0}
  .deck{height:auto}.cd{position:relative;transform:none!important;opacity:1!important;margin-bottom:16px}}
</style></head><body>
<nav><b id="nb"></b><button id="tt">Light</button></nav>
<div class="pad"><section class="hero"><div class="k mono">Freelance web developer</div>
  <h1>Flip through <em>the work.</em></h1><p id="intro"></p></section></div>
<div class="flowwrap" id="fw"><div class="flow"><div class="deck" id="deck"></div><div class="rail" id="rail"></div></div></div>
<div class="pad">
  <section class="sec"><div class="lab mono">Services</div><h2>What you can buy.</h2>
    <div class="grid" id="svc"></div><div class="chips" id="chips"></div></section>
  <section class="cta"><h2 style="font-weight:900;font-size:clamp(28px,7.4vw,80px);letter-spacing:-.05em">Have an idea?</h2>
    <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section>
</div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent = S.name; intro.textContent = S.intro; wa.href = S.wa;
deck.innerHTML = S.projects.map(p => `
  <a class="cd" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
    <div class="face"><span class="k mono">${p.type}</span><b>${p.t}</b></div>
    <div class="body"><p>${p.s}</p>
      <div class="st">${p.stack.map(x=>`<span class="mono">${x}</span>`).join("")}</div>
      <span class="go mono">Visit ${p.href.replace("https://","")} ↗</span></div></a>`).join("");
rail.innerHTML = S.projects.map(() => "<i></i>").join("");
svc.innerHTML = S.services.map(s => `<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML = S.skills.map(t => `<span class="mono">${t}</span>`).join("");

const cards = [...deck.children], dots = [...rail.children], fw = document.getElementById("fw");
function frame(){
  const travel = fw.offsetHeight - innerHeight;
  const p = travel > 0 ? Math.max(0, Math.min(1, -fw.getBoundingClientRect().top / travel)) : 0;
  const pos = p * (cards.length - 1);          // which card is front and centre
  cards.forEach((c, i) => {
    const d = i - pos;                          // signed distance from focus
    const a = Math.abs(d);
    c.style.transform = `translate3d(${d * 34}px,${a * 16}px,${-a * 190}px) rotateY(${d * -22}deg) scale(${1 - a * 0.06})`;
    c.style.opacity = String(Math.max(0, 1 - a * 0.42));
    c.style.zIndex = String(100 - Math.round(a * 10));
    c.style.pointerEvents = a < 0.5 ? "auto" : "none";
  });
  dots.forEach((n, i) => n.classList.toggle("on", Math.round(pos) === i));
}
addEventListener("scroll", frame, { passive: true });
addEventListener("resize", frame);
frame();

const root = document.documentElement;
try { if (localStorage.getItem("d27t") === "light") root.setAttribute("data-theme","light"); } catch {}
const paint = () => tt.textContent = root.getAttribute("data-theme") === "light" ? "Dark" : "Light"; paint();
tt.onclick = () => { const l = root.getAttribute("data-theme") === "light";
  if (l) root.removeAttribute("data-theme"); else root.setAttribute("data-theme","light");
  try { localStorage.setItem("d27t", l ? "dark" : "light"); } catch {} paint(); };
window.switcher("27");
</script></body></html>
