<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D96 — Countdown</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15);}
:root[data-theme="light"]{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15)}*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
.hero h1{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:clamp(40px,12vw,132px);letter-spacing:.01em;line-height:.94}
/* A pitch clock. Sixty seconds per project, running while you read it — the
   constraint is the design, and it makes the copy earn its length. */
.clock{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;margin-top:4vh}
.clock .t{font-family:"Bebas Neue",sans-serif;font-size:clamp(40px,10vw,78px);color:var(--gold);
  line-height:1;font-variant-numeric:tabular-nums;min-width:3ch}
.clock .m{flex:1;min-width:200px}
.clock .k{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.clock h3{font-family:"Bebas Neue",sans-serif;font-size:clamp(24px,5.4vw,44px);letter-spacing:.01em;margin-top:5px;line-height:1}
.clock p{color:var(--dim);font-size:14px;line-height:1.66;margin-top:7px;max-width:52ch}
.clock .bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.clock .bar i{display:block;height:100%;background:var(--c);width:100%}
.clock a{display:inline-block;margin-top:12px;color:var(--gold);font-family:"DM Mono",monospace;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.ctrl{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ctrl button{background:none;border:1px solid var(--line);color:var(--ink);font-family:"DM Mono",monospace;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:99px;cursor:pointer}
.ctrl button:hover{border-color:var(--gold);color:var(--gold)}
.rows{margin-top:5vh}
.rw{display:block;text-decoration:none;color:inherit;padding:15px 0;border-top:1px solid var(--line)}
.rw h4{font-family:"Bebas Neue",sans-serif;font-size:24px;letter-spacing:.01em}
.rw p{color:var(--dim);font-size:13.5px;line-height:1.6;margin-top:5px}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Sixty seconds<br>each.</h1><p id="intro"></p></section>
 <div class="clock" id="clock"></div>
 <div class="ctrl"><button id="pv">← Prev</button><button id="pp">Pause</button><button id="nx">Next →</button></div>
 <div class="rows" id="rows"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
let i=0,left=60,running=!matchMedia("(prefers-reduced-motion: reduce)").matches;
function draw(){const p=S.projects[i];
  clock.style.setProperty("--c",p.c);
  clock.innerHTML=`<span class="t">${String(left).padStart(2,"0")}</span>
   <span class="m"><span class="k">${p.type}</span><h3>${p.t}</h3><p>${p.s}</p>
    <span class="bar"><i style="width:${(left/60*100).toFixed(0)}%"></i></span>
    <a href="${p.href}" target="_blank" rel="noreferrer">Visit ${p.href.replace("https://","")} ↗</a></span>`;}
function go(n){i=(n+S.projects.length)%S.projects.length;left=60;draw()}
setInterval(()=>{if(!running)return;left--;if(left<0)go(i+1);else draw()},1000);
pv.onclick=()=>go(i-1); nx.onclick=()=>go(i+1);
pp.onclick=()=>{running=!running;pp.textContent=running?"Pause":"Resume"};
if(!running)pp.textContent="Resume";
go(0);
rows.innerHTML=S.projects.map((p,n)=>`<a class="rw" href="${p.href}" target="_blank" rel="noreferrer">
  <h4>${String(n+1).padStart(2,"0")} — ${p.t}</h4><p>${p.type} · ${p.stack.join(", ")}</p></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d96t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("96");
</script></body></html>
