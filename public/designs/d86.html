<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D86 — Columns</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15);}
:root[data-theme="light"]{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15)}*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Inter,system-ui,sans-serif}
/* Vertical tickers running in opposite directions. Scroll is horizontal-feeling
   without being a horizontal scroll, which is the trick. */
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;height:78svh;overflow:hidden;margin-top:4vh;
  border-block:1px solid var(--line)}
@media(min-width:860px){.cols{grid-template-columns:repeat(4,1fr)}}
.col{overflow:hidden;position:relative}
.trk{display:grid;gap:10px;will-change:transform;padding:10px 0}
.cd{border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;background:var(--bg)}
.cd .f{height:96px;background:var(--c);display:grid;place-items:center;padding:10px}
.cd .f b{color:rgba(255,255,255,.96);font-family:Anton,sans-serif;font-size:15px;text-transform:uppercase;text-align:center;line-height:1.1}
.cd .i{padding:10px 11px 13px}
.cd .k{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.cd p{color:var(--dim);font-size:11.5px;line-height:1.5;margin-top:5px}
.hero{padding:17vh 0 2vh}
.hero h1{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(32px,9vw,96px);line-height:.92;letter-spacing:-.01em}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
.rows{margin-top:5vh}
.rw{display:block;text-decoration:none;color:inherit;padding:16px 0;border-top:1px solid var(--line)}
.rw h3{font-family:Anton,sans-serif;text-transform:uppercase;font-size:clamp(21px,4.6vw,38px);letter-spacing:-.01em}
.rw p{color:var(--dim);font-size:13.5px;line-height:1.62;margin-top:7px;max-width:56ch}
@media(prefers-reduced-motion:reduce){.trk{transform:none!important}}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Always<br>moving.</h1><p id="intro"></p></section></div>
 <div class="pad"><div class="cols" id="cols"></div><div class="rows" id="rows"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
const card=p=>`<a class="cd" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <div class="f"><b>${p.t}</b></div><div class="i"><div class="k">${p.type}</div><p>${p.s}</p></div></a>`;
const N=matchMedia("(min-width:860px)").matches?4:2;
cols.innerHTML=Array.from({length:N},(_,c)=>{
  const set=S.projects.slice(c%2).concat(S.projects.slice(0,c%2));
  return `<div class="col"><div class="trk" data-d="${c%2?1:-1}">${set.map(card).join("")}${set.map(card).join("")}</div></div>`;
}).join("");
rows.innerHTML=S.projects.map(p=>`<a class="rw" href="${p.href}" target="_blank" rel="noreferrer">
  <h3>${p.t}</h3><p>${p.s}</p></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const trks=[...document.querySelectorAll(".trk")].map(el=>({el,y:0,d:+el.dataset.d}));
let last=0,boost=0,prev=scrollY;
addEventListener("scroll",()=>{boost=Math.min(5,Math.abs(scrollY-prev)*.2);prev=scrollY},{passive:true});
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)
 (function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;boost*=.93;
  trks.forEach(k=>{k.y+=k.d*22*(1+boost)*dt;const h=k.el.scrollHeight/2;
   if(k.y<=-h)k.y+=h; if(k.y>=0)k.y-=h;
   k.el.style.transform=`translateY(${k.y}px)`;});
  requestAnimationFrame(loop);})(0);
const root = document.documentElement;
const KEY = "d86t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("86");
</script></body></html>
