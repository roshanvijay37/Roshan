<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D66 — Scoreboard</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0a;--panel:#101410;--ink:#e9f0e6;--gold:#f2c235;--dim:#8a9487;--line:rgba(233,240,230,.16)}
:root[data-theme="light"]{--bg:#eef0ec;--panel:#f8faf6;--ink:#0d110c;--gold:#7a5f10;--dim:#5c6459;--line:rgba(13,17,12,.16)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Oswald,system-ui,sans-serif}
.hero h1{text-transform:uppercase;letter-spacing:.01em;font-weight:700}
/* A stadium board: everything in caps, tabular figures, one row per fixture. */
.board{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);margin-top:4vh}
.bh{display:grid;grid-template-columns:1fr 78px;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);
  font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
@media(min-width:760px){.bh{grid-template-columns:44px 1fr 200px 78px}}
.br{display:grid;grid-template-columns:1fr 78px;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);
  align-items:center;text-decoration:none;color:inherit}
@media(min-width:760px){.br{grid-template-columns:44px 1fr 200px 78px}}
.br:last-child{border-bottom:0}
.br:hover{background:rgba(242,194,53,.07)}
.br .no{font-family:"DM Mono",monospace;color:var(--gold);font-size:15px;display:none}
@media(min-width:760px){.br .no{display:block}}
.br .n{font-size:20px;text-transform:uppercase;letter-spacing:.01em;font-weight:500}
.br .d{color:var(--dim);font-size:12.5px;font-family:"DM Mono",monospace;margin-top:3px}
.br .k{color:var(--dim);font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:none}
@media(min-width:760px){.br .k{display:block}}
.br .s{font-family:"DM Mono",monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-align:right}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Played five.<br>Shipped five.</h1><p id="intro"></p></section>
 <div class="board"><div class="bh"><span class="no">#</span><span>Fixture</span><span class="k">Competition</span><span style="text-align:right">Result</span></div>
 <div id="rows"></div></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
rows.innerHTML=S.projects.map((p,i)=>`<a class="br" href="${p.href}" target="_blank" rel="noreferrer">
  <span class="no">${String(i+1).padStart(2,"0")}</span>
  <span><span class="n">${p.t}</span><span class="d">${p.href.replace("https://","")}</span></span>
  <span class="k">${p.type}</span><span class="s">Live ↗</span></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d66t", ALT = "light";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Dark" : "Light"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("66");
</script></body></html>
