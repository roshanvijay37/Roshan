<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D40 — Isometric</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.hero{padding:19vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(32px,8vw,86px);letter-spacing:-.045em;line-height:1}
.hero p{margin-top:18px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
/* Cards laid on a drafting plane at a fixed axonometric angle, straightening
   as they enter view so the content stays readable. */
/* overflow:hidden because a rotated card's bounding box is far wider than the
   card, and without it the page scrolled sideways on a phone. The angle also
   eases off on narrow screens, where a hard 32deg leaves the text unreadable. */
.iso{perspective:1600px;padding:5vh 0 4vh;display:grid;gap:26px;overflow:hidden}
@media(max-width:700px){.slab{transform:rotateX(30deg) rotateZ(-14deg)}}
.slab{transform:rotateX(46deg) rotateZ(-32deg);transform-origin:50% 50%;transition:transform 1.1s cubic-bezier(.2,.8,.2,1);
  text-decoration:none;color:inherit;display:block}
.slab.up{transform:rotateX(0deg) rotateZ(0deg)}
.slab .top{background:var(--c);padding:18px;border-radius:10px 10px 0 0}
.slab .top b{color:rgba(255,255,255,.96);font-weight:800;font-size:clamp(21px,4.4vw,36px);letter-spacing:-.03em}
.slab .base{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:15px 17px 19px;
  background:var(--bg);box-shadow:0 22px 46px rgba(0,0,0,.14)}
.slab .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.slab p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:8px}
.slab .st{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.slab .st span{font-size:10px;border:1px solid var(--line);padding:5px 8px;border-radius:99px;color:var(--dim)}
.slab .go{display:inline-block;margin-top:11px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
@media(prefers-reduced-motion:reduce){.slab{transform:none!important}}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Laid out flat,<br>then stood up.</h1><p id="intro"></p></section>
 <div class="iso" id="iso"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
iso.innerHTML=S.projects.map(p=>`<a class="slab" href="${p.href}" target="_blank" rel="noreferrer">
  <div class="top" style="--c:${p.c}"><b>${p.t}</b></div>
  <div class="base"><div class="k mono">${p.type}</div><p>${p.s}</p>
  <div class="st">${p.stack.map(x=>`<span class="mono">${x}</span>`).join("")}</div>
  <span class="go mono">Visit ↗</span></div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle("up",e.isIntersecting)),{threshold:.34});
document.querySelectorAll(".slab").forEach(el=>io.observe(el));
const root = document.documentElement;
const KEY = "d40t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("40");
</script></body></html>
