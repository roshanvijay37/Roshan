<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D19 — Marquee Wall</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe3;--ink:#12100a;--gold:#7d5f10;--dim:#6a6252;--line:rgba(18,16,10,.15)}
:root[data-theme="dark"]{--bg:#090907;--ink:#f0e9d8;--gold:#e6c374;--dim:#8e8674;--line:rgba(240,233,216,.14)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.anton{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:-.005em;line-height:.9}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1180px);margin:auto}
nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;border-radius:99px;padding:7px 12px;cursor:pointer}

/* Everything is a ticker. The page is a wall of moving type and the rows run at
   different speeds and directions, so the eye never settles into a grid. */
.strip{overflow:hidden;border-bottom:2px solid var(--ink);padding:10px 0;white-space:nowrap}
.strip .track{display:inline-flex;gap:38px;will-change:transform}
.strip b{font-size:clamp(30px,7.6vw,84px);letter-spacing:-.01em}
.strip.small b{font-size:clamp(13px,2.4vw,20px);letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--dim)}
.strip.hollow b{color:transparent;-webkit-text-stroke:1.4px var(--ink)}
.hero{padding:16vh 0 6vh}
.hero p{max-width:46ch;color:var(--dim);line-height:1.78;font-size:15.5px;margin-top:20px}
.hero .k{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.work{border-top:2px solid var(--ink)}
.row{display:block;text-decoration:none;color:inherit;border-bottom:2px solid var(--ink);padding:18px 0;overflow:hidden}
.row .top{display:flex;justify-content:space-between;gap:12px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.row h3{font-size:clamp(30px,9vw,84px);margin:6px 0 0}
.row p{color:var(--dim);font-size:14px;line-height:1.66;margin-top:10px;max-width:56ch}
.row .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.row .st span{font-size:10px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--dim)}
.row .bar{height:4px;background:var(--c);margin-top:14px;transform-origin:left;transform:scaleX(.14);transition:transform .5s}
.row:hover .bar{transform:scaleX(1)}
.sec{padding:10vh 0}
.lab{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:2px solid var(--ink);padding:16px 0 20px}
.sv h4{font-weight:700;font-size:19px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.68;margin-top:7px}
.cta{padding:9vh 0 14vh;text-align:center}
.btn{display:inline-block;margin-top:22px;background:var(--ink);color:var(--bg);text-decoration:none;padding:16px 24px;border-radius:99px;font-weight:700;font-size:14px}
@media(prefers-reduced-motion:reduce){.track{transform:none!important}}
</style></head><body>
<nav><b id="nb"></b><button id="tt">Dark</button></nav>
<div class="strip" style="margin-top:52px"><div class="track anton" data-sp="-26" id="m1"></div></div>
<div class="strip hollow"><div class="track anton" data-sp="18" id="m2"></div></div>
<div class="strip small"><div class="track mono" data-sp="-11" id="m3"></div></div>
<div class="pad">
  <section class="hero"><div class="k mono">Freelance web developer</div>
    <h1 class="anton" style="font-size:clamp(38px,10vw,116px);margin-top:14px">Always shipping.</h1>
    <p id="intro"></p></section>
</div>
<div class="pad"><div class="work" id="list"></div>
  <section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div></section></section>
</div>
<div class="strip hollow"><div class="track anton" data-sp="-15" id="m4"></div></div>
<div class="pad"><section class="cta"><h2 class="anton" style="font-size:clamp(30px,8vw,86px)">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent = S.name; intro.textContent = S.intro; wa.href = S.wa;
const rep = (arr, n) => Array(n).fill(arr).flat();
m1.innerHTML = rep(S.projects.map(p => p.t), 3).map(t => `<b>${t}</b>`).join("");
m2.innerHTML = rep(["Next.js","Astro","Three.js","Supabase",".NET Core","React"], 4).map(t => `<b>${t}</b>`).join("");
m3.innerHTML = rep(S.skills, 2).map(t => `<b>${t}</b>`).join("");
m4.innerHTML = rep(["Available for freelance","Based in India","Let's build"], 4).map(t => `<b>${t}</b>`).join("");

list.innerHTML = S.projects.map(p => `
  <a class="row" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
    <div class="top mono"><span>${p.type}</span><span>Visit ↗</span></div>
    <h3 class="anton">${p.t}</h3><p>${p.s}</p>
    <div class="st">${p.stack.map(x => `<span class="mono">${x}</span>`).join("")}</div>
    <div class="bar"></div></a>`).join("");
svc.innerHTML = S.services.map(s => `<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");

// Own rAF loop rather than CSS keyframes: the rows need independent speeds and
// a scroll boost, which a keyframe cannot express.
const tracks = [...document.querySelectorAll(".track")].map(el => ({ el, x: 0, sp: +el.dataset.sp }));
tracks.forEach(t => t.el.innerHTML += t.el.innerHTML);
let last = 0, boost = 0, prevY = scrollY;
addEventListener("scroll", () => { boost = Math.min(6, Math.abs(scrollY - prevY) * 0.22); prevY = scrollY; }, { passive: true });
if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
  (function loop(ts){ const dt = Math.min((ts - last) / 1000, 0.05); last = ts; boost *= 0.92;
    tracks.forEach(t => { t.x += t.sp * (1 + boost) * dt;
      const w = t.el.scrollWidth / 2; if (t.x <= -w) t.x += w; if (t.x >= 0) t.x -= w;
      t.el.style.transform = `translateX(${t.x}px)`; });
    requestAnimationFrame(loop); })(0);

const root = document.documentElement;
try { if (localStorage.getItem("d19t") === "dark") root.setAttribute("data-theme","dark"); } catch {}
const paint = () => tt.textContent = root.getAttribute("data-theme") === "dark" ? "Light" : "Dark"; paint();
tt.onclick = () => { const d = root.getAttribute("data-theme") === "dark";
  if (d) root.removeAttribute("data-theme"); else root.setAttribute("data-theme","dark");
  try { localStorage.setItem("d19t", d ? "light" : "dark"); } catch {} paint(); };
window.switcher("19");
</script></body></html>
