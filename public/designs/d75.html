<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D75 — Elements</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
/* A periodic table. Each project gets a symbol, a number and a group colour;
   the stack becomes the trace elements underneath. */
.tbl{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:4vh}
.el{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;padding:9px;display:flex;flex-direction:column;
  justify-content:space-between;text-decoration:none;color:inherit;background:var(--bg);transition:.25s;position:relative;overflow:hidden}
.el::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.el:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 12px 26px rgba(0,0,0,.14)}
.el .no{font-family:"DM Mono",monospace;font-size:10px;color:var(--dim)}
.el .sym{font-weight:700;font-size:clamp(24px,5vw,34px);letter-spacing:-.03em;line-height:1}
.el .nm{font-size:10.5px;color:var(--dim);line-height:1.25}
.el.small{aspect-ratio:auto;padding:8px}
.el.small .sym{font-size:16px}
.key{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.rows{margin-top:5vh}
.rw{display:grid;grid-template-columns:1fr;gap:4px;padding:15px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
@media(min-width:760px){.rw{grid-template-columns:52px 1fr 130px;gap:18px;align-items:baseline}}
.rw .s{font-weight:700;font-size:20px}
.rw p{color:var(--dim);font-size:13.5px;line-height:1.62}
.rw .g{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>The table<br>of what I build.</h1><p id="intro"></p></section>
 <div class="tbl" id="tbl"></div><div class="key" id="key"></div>
 <div class="lab mono" style="margin-top:5vh">Trace elements</div><div class="tbl" id="tr"></div>
 <div class="rows" id="rows"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
const sym=t=>t.replace(/[^A-Za-z]/g,"").slice(0,2);
tbl.innerHTML=S.projects.map((p,i)=>`<a class="el" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <span class="no">${String(i+1).padStart(2,"0")}</span>
  <span class="sym">${sym(p.t)}</span><span class="nm">${p.t}</span></a>`).join("");
key.innerHTML=S.projects.map(p=>`<span><i style="background:${p.c}"></i>${p.type}</span>`).join("");
tr.innerHTML=S.skills.map((t,i)=>`<div class="el small" style="--c:var(--gold)">
  <span class="no">${String(i+1).padStart(2,"0")}</span><span class="sym">${sym(t)}</span><span class="nm">${t}</span></div>`).join("");
rows.innerHTML=S.projects.map(p=>`<a class="rw" href="${p.href}" target="_blank" rel="noreferrer">
  <div class="s">${sym(p.t)}</div><p><b>${p.t}</b> — ${p.s}</p><div class="g mono">Visit ↗</div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d75t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("75");
</script></body></html>
