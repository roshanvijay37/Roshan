<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D82 — Vending</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#141b1a;--case:#1d2a28;--glass:rgba(190,230,225,.08);--ink:#ecf5f3;--gold:#ffd34d;--dim:#8fa5a1;--line:rgba(236,245,243,.18)}
:root[data-theme="light"]{--bg:#eaf1ef;--case:#f6faf9;--glass:rgba(20,40,38,.05);--ink:#0f1a18;--gold:#8a5f10;--dim:#5b6b68;--line:rgba(15,26,24,.18)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
.hero h1{font-family:Bungee,cursive;font-weight:400;font-size:clamp(28px,7vw,72px);letter-spacing:0;line-height:1.05}
/* A machine. Numbered slots behind glass, a keypad, and a tray that fills when
   you punch a code — the interaction is a purchase, not a click. */
.machine{background:var(--case);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:4vh;
  display:grid;gap:14px;box-shadow:0 22px 50px rgba(0,0,0,.3)}
@media(min-width:820px){.machine{grid-template-columns:1fr 220px}}
.glassbox{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:12px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.glassbox{grid-template-columns:repeat(3,1fr)}}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;gap:7px;transition:.22s;background:rgba(0,0,0,.12)}
.slot:hover{transform:translateY(-3px);border-color:var(--gold)}
.slot .code{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--gold)}
.slot .can{height:72px;border-radius:6px;background:var(--c);display:grid;place-items:center;padding:6px}
.slot .can b{color:rgba(255,255,255,.96);font-family:Bungee,cursive;font-size:12px;text-align:center;line-height:1.1}
.slot .n{font-size:12.5px;font-weight:600;line-height:1.2}
.pad2{display:grid;gap:10px;align-content:start}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button{background:none;border:1px solid var(--line);color:var(--ink);font-family:"DM Mono",monospace;
  font-size:15px;padding:12px 0;border-radius:7px;cursor:pointer}
.keys button:hover{border-color:var(--gold);color:var(--gold)}
.screen{border:1px solid var(--line);border-radius:7px;padding:11px 12px;background:rgba(0,0,0,.2);
  font-family:"DM Mono",monospace;font-size:12px;color:var(--gold);min-height:52px}
.tray{border:1px solid var(--line);border-radius:8px;padding:12px;min-height:96px;background:rgba(0,0,0,.16)}
.tray .k{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.tray h4{font-size:16px;font-weight:700;margin:6px 0 4px}
.tray p{color:var(--dim);font-size:12.5px;line-height:1.55}
.tray a{display:inline-block;margin-top:8px;color:var(--gold);font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Pick a<br>slot.</h1><p id="intro"></p></section>
 <div class="machine"><div class="glassbox" id="box"></div>
  <div class="pad2"><div class="screen" id="scr">Enter a code…</div>
   <div class="keys" id="keys"></div>
   <div class="tray" id="tray"><div class="k">Tray</div><p style="margin-top:8px">Nothing dispensed yet.</p></div></div></div>
 <section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
const CODES=S.projects.map((p,i)=>({...p,code:"A"+(i+1)}));
box.innerHTML=CODES.map(p=>`<a class="slot" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <span class="code">${p.code}</span><span class="can"><b>${p.t}</b></span><span class="n">${p.type}</span></a>`).join("");
keys.innerHTML=["A","1","2","3","4","5","C","0","↵"].map(k=>`<button data-k="${k}">${k}</button>`).join("");
let buf="";
function render(){scr.textContent=buf?("> "+buf):"Enter a code…"}
function dispense(){
  const p=CODES.find(x=>x.code===buf.toUpperCase());
  if(!p){scr.textContent="> "+buf+" — no such slot";buf="";return}
  tray.innerHTML=`<div class="k">Dispensed</div><h4>${p.t}</h4><p>${p.s}</p>
   <a href="${p.href}" target="_blank" rel="noreferrer">Open ${p.href.replace("https://","")} ↗</a>`;
  scr.textContent="> "+buf+" — thank you";buf="";
}
keys.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;
  if(k==="C"){buf="";render()} else if(k==="↵"){dispense()} else {buf=(buf+k).slice(0,3);render()}});
render();
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d82t", ALT = "light";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Dark" : "Light"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("82");
</script></body></html>
