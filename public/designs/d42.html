<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D42 — Accordion</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Manrope,system-ui,sans-serif}
.hero{padding:19vh 0 4vh}
.hero h1{font-weight:800;font-size:clamp(32px,8vw,88px);letter-spacing:-.045em;line-height:1}
.hero p{margin-top:18px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
/* One open at a time. The closed rows stay big enough to read, so the page is
   a list first and a detail view second. */
.acc{border-top:1px solid var(--line);margin-top:4vh}
.pan{border-bottom:1px solid var(--line)}
.hd{width:100%;background:none;border:0;color:inherit;font:inherit;display:flex;align-items:center;gap:14px;
  padding:22px 0;cursor:pointer;text-align:left}
.hd i{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.hd .t{font-weight:800;font-size:clamp(22px,5vw,44px);letter-spacing:-.04em;flex:1;line-height:1.02}
.hd .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap;display:none}
@media(min-width:720px){.hd .k{display:block}}
.hd .pm{width:22px;height:22px;position:relative;flex:none}
.hd .pm::before,.hd .pm::after{content:"";position:absolute;background:var(--gold);transition:transform .35s}
.hd .pm::before{left:0;right:0;top:10px;height:2px}
.hd .pm::after{top:0;bottom:0;left:10px;width:2px}
.pan.on .pm::after{transform:scaleY(0)}
.bd{overflow:hidden;max-height:0;transition:max-height .55s cubic-bezier(.2,.8,.2,1)}
.pan.on .bd{max-height:460px}
.bd .in{padding:0 0 26px 26px}
.bd .band{height:120px;border-radius:8px;background:var(--c);display:grid;place-items:center;margin-bottom:14px}
.bd .band b{color:rgba(255,255,255,.96);font-weight:800;font-size:24px;letter-spacing:-.02em}
.bd p{color:var(--dim);font-size:15px;line-height:1.72;max-width:54ch}
.bd .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.bd .st span{font-size:10px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--dim)}
.bd a{display:inline-block;margin-top:14px;color:var(--gold);font-size:11px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Open what<br>you care about.</h1><p id="intro"></p></section>
 <div class="acc" id="acc"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
acc.innerHTML=S.projects.map((p,i)=>`<div class="pan${i===0?" on":""}" style="--c:${p.c}">
  <button class="hd" aria-expanded="${i===0}"><i></i><span class="t">${p.t}</span>
    <span class="k mono">${p.type}</span><span class="pm"></span></button>
  <div class="bd"><div class="in"><div class="band"><b>${p.t}</b></div><p>${p.s}</p>
    <div class="st">${p.stack.map(x=>`<span class="mono">${x}</span>`).join("")}</div>
    <a class="mono" href="${p.href}" target="_blank" rel="noreferrer">Visit ${p.href.replace("https://","")} ↗</a></div></div></div>`).join("");
acc.querySelectorAll(".hd").forEach(h=>h.onclick=()=>{
  const pan=h.parentElement,open=pan.classList.contains("on");
  acc.querySelectorAll(".pan").forEach(p=>{p.classList.remove("on");p.querySelector(".hd").setAttribute("aria-expanded","false")});
  if(!open){pan.classList.add("on");h.setAttribute("aria-expanded","true")}
});
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d42t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("42");
</script></body></html>
