<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D77 — Invoice</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--card:#fdfbf5}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--card:#131109}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Inter,system-ui,sans-serif;font-size:14px}
.pad{width:min(100% - 20px,820px);padding:54px 0 110px}
/* A statement of work. Line items, quantities, a total that reads "all live" —
   the register of someone who has already been paid to do this. */
.doc{background:var(--card);border:1px solid var(--line);padding:34px 26px 40px;box-shadow:0 18px 46px rgba(0,0,0,.11)}
.top{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-start}
.top h1{font-weight:700;font-size:clamp(24px,5vw,40px);letter-spacing:-.03em}
.top .m{font-family:"DM Mono",monospace;font-size:11px;color:var(--dim);line-height:1.9;text-align:right}
.top .m b{color:var(--ink);font-weight:500}
.bill{display:grid;grid-template-columns:1fr;gap:16px;margin:26px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media(min-width:640px){.bill{grid-template-columns:1fr 1fr}}
.bill .k{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.bill p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);font-weight:500;padding:0 8px 9px 0;border-bottom:1px solid var(--line)}
th:last-child,td:last-child{text-align:right}
td{padding:13px 8px 13px 0;border-bottom:1px solid var(--line);vertical-align:top}
td a{color:inherit;text-decoration:none;font-weight:600;font-size:15.5px}
td a:hover{color:var(--gold)}
td .d{color:var(--dim);font-size:12.5px;line-height:1.55;margin-top:4px}
td .s{font-family:"DM Mono",monospace;font-size:11px;color:var(--dim);margin-top:4px}
td .st{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.tot{display:flex;justify-content:flex-end;gap:26px;padding:16px 8px 0;font-family:"DM Mono",monospace;font-size:12.5px}
.tot b{font-size:15px;letter-spacing:.06em}
.note{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;line-height:1.7}
.wa{display:inline-block;margin-top:14px;background:var(--ink);color:var(--card);text-decoration:none;
  padding:13px 19px;border-radius:5px;font-weight:600;font-size:13.5px}
#tt{position:fixed;top:14px;right:14px;z-index:60;background:none;border:1px solid var(--line);color:var(--gold);
  font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;cursor:pointer;border-radius:4px}
</style></head><body>
<button id="tt">Dark</button><div class="pad"><div class="doc">
  <div class="top"><div><h1 id="nb"></h1><div class="mono" style="color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:6px">Statement of work</div></div>
   <div class="m"><div>No. <b>001</b></div><div>Status <b>Delivered</b></div><div>Terms <b>Available now</b></div></div></div>
  <div class="bill"><div><div class="k">From</div><p><b id="fn2"></b><br>Freelance web developer, India</p></div>
   <div><div class="k">Summary</div><p id="intro"></p></div></div>
  <table><thead><tr><th>Item</th><th>Qty</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
  <div class="tot"><span>Total delivered</span><b>5 / 5 live</b></div>
  <div class="note" id="svcn"></div>
  <div class="note">Materials — <span id="chips"></span></div>
  <a class="wa" id="wa" href="#">Message me on WhatsApp →</a>
 </div></div><div style="display:none"><div id="svc"></div></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
fn2.textContent=S.name;
rows.innerHTML=S.projects.map(p=>`<tr><td><a href="${p.href}" target="_blank" rel="noreferrer">${p.t}</a>
  <div class="d">${p.s}</div><div class="s">${p.type} — ${p.href.replace("https://","")}</div></td>
  <td class="mono">${p.stack.length}</td><td><span class="st">Live ↗</span></td></tr>`).join("");
svcn.innerHTML="Also available — "+S.services.map(s=>"<b>"+s.t+"</b>").join(", ")+".";
chips.textContent=S.skills.join(", ");
const root = document.documentElement;
const KEY = "d77t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("77");
</script></body></html>
