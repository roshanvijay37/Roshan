<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D59 — Boarding Pass</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--card:#fbf7ec}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--card:#17140e}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:"Barlow Condensed",system-ui,sans-serif}
.hero h1{font-size:clamp(34px,9vw,96px);letter-spacing:-.02em}
/* Tickets with a perforated stub. Everything reads as printed fields, which
   suits a set of facts more than a set of paragraphs. */
.tix{display:grid;gap:16px;margin-top:4vh}
.tk{display:grid;grid-template-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;text-decoration:none;color:inherit;position:relative;transition:.25s}
@media(min-width:760px){.tk{grid-template-columns:1fr 200px}}
.tk:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(0,0,0,.15)}
.tk .main{padding:18px 20px 20px;border-bottom:2px dashed var(--line)}
@media(min-width:760px){.tk .main{border-bottom:0;border-right:2px dashed var(--line)}}
.tk .route{display:flex;align-items:center;gap:12px;font-size:clamp(24px,5vw,42px);font-weight:700;letter-spacing:-.01em}
.tk .route i{flex:1;height:2px;background:var(--c);position:relative;font-style:normal}
.tk .route i::after{content:"✈";position:absolute;right:-4px;top:-11px;font-size:15px;color:var(--c)}
.tk .fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media(min-width:560px){.tk .fields{grid-template-columns:repeat(4,1fr)}}
.tk .f span{display:block;font-family:"DM Mono",monospace;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.tk .f b{display:block;font-size:14px;font-weight:600;margin-top:3px}
.tk p{color:var(--dim);font-size:13.5px;line-height:1.6;margin-top:14px;max-width:52ch}
.tk .stub{padding:18px 20px;display:grid;align-content:center;gap:6px;text-align:center;background:var(--c);color:#fff}
.tk .stub b{font-size:22px;font-weight:700}
.tk .stub span{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.tk .stub .code{margin-top:8px;height:34px;background-image:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px);opacity:.85}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Five departures.<br>All landed.</h1><p id="intro"></p></section><div class="tix" id="tix"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
tix.innerHTML=S.projects.map((p,i)=>{const code=p.t.replace(/[^A-Za-z]/g,"").slice(0,3).toUpperCase();
 return `<a class="tk" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <div class="main"><div class="route">BRIEF <i></i> ${code}</div>
   <div class="fields">
    <div class="f"><span>Project</span><b>${p.t}</b></div>
    <div class="f"><span>Type</span><b>${p.type}</b></div>
    <div class="f"><span>Gate</span><b>${p.href.replace("https://","")}</b></div>
    <div class="f"><span>Status</span><b>Live</b></div></div>
   <p>${p.s}</p></div>
  <div class="stub"><b>${code}</b><span>Seat ${String(i+1).padStart(2,"0")}</span><div class="code"></div></div></a>`}).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d59t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("59");
</script></body></html>
