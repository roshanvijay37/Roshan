<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D57 — Comic</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--ink2:#0f0d07}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Inter,system-ui,sans-serif}
.bang{font-family:Bangers,Impact,cursive;letter-spacing:.02em;font-weight:400}
.hero{padding:18vh 0 3vh}
.hero h1{font-family:Bangers,Impact,cursive;font-size:clamp(38px,10vw,110px);line-height:.94;letter-spacing:.01em}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
/* Panels with heavy borders and a caption box in the corner, read left to right
   then down — the reading order does the sequencing for you. */
.strip{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:760px){.strip{grid-template-columns:repeat(2,1fr)}
 .panel:first-child{grid-column:1/-1}}
.panel{border:4px solid var(--ink2);border-radius:3px;background:var(--c);position:relative;overflow:hidden;
  min-height:210px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;
  box-shadow:6px 6px 0 var(--ink2);transition:.2s}
.panel:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--ink2)}
.panel .cap{position:absolute;top:0;left:0;background:#fdf6dd;border:3px solid var(--ink2);border-top:0;border-left:0;
  padding:6px 11px;font-family:Bangers,cursive;font-size:15px;letter-spacing:.03em;color:var(--ink2)}
.panel h3{font-family:Bangers,cursive;font-size:clamp(26px,5.4vw,46px);color:#fff;letter-spacing:.02em;
  text-shadow:3px 3px 0 var(--ink2)}
.panel p{color:rgba(255,255,255,.95);font-size:13.5px;line-height:1.6;margin-top:8px;max-width:44ch}
.panel .go{margin-top:10px;background:#fdf6dd;color:var(--ink2);font-family:Bangers,cursive;font-size:15px;
  padding:5px 12px;border:3px solid var(--ink2);width:max-content;letter-spacing:.03em}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Five builds,<br>one page.</h1><p id="intro"></p></section>
 <div class="strip" id="strip"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
strip.innerHTML=S.projects.map((p,i)=>`<a class="panel" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <span class="cap">${i+1}. ${p.type}</span><h3>${p.t}</h3><p>${p.s}</p><span class="go">Visit! ↗</span></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d57t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("57");
</script></body></html>
