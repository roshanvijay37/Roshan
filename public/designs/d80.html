<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D80 — Postits</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--cork:#c9a97b}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--cork:#221a11}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
.hero h1{font-family:Kalam,cursive;font-weight:700;font-size:clamp(36px,9vw,92px);letter-spacing:0;line-height:1}
/* A cork board of notes. Square, saturated, tilted, with a pin — the format
   makes five items feel like a working wall rather than a thin list. */
.board{background:var(--cork);border-radius:12px;padding:26px 18px 32px;margin-top:4vh;
  display:flex;flex-wrap:wrap;gap:20px;justify-content:center;
  background-image:radial-gradient(rgba(0,0,0,.09) 1px,transparent 1px);background-size:9px 9px}
.note{width:min(88%,236px);aspect-ratio:1;padding:20px 18px;transform:rotate(var(--r));
  box-shadow:3px 5px 12px rgba(0,0,0,.24);text-decoration:none;color:#1b1509;position:relative;
  display:flex;flex-direction:column;transition:transform .28s}
.note:hover{transform:rotate(0) scale(1.04);z-index:5}
.note::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:11px;height:11px;
  border-radius:50%;background:#b8402c;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.note .k{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-top:12px}
.note h3{font-family:Kalam,cursive;font-weight:700;font-size:23px;line-height:1.1;margin:6px 0 7px}
.note p{font-family:Kalam,cursive;font-size:15px;line-height:1.35;flex:1;overflow:hidden}
.note .go{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Everything,<br>pinned up.</h1><p id="intro"></p></section>
 <div class="board" id="board"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
const PAPER=["#f4e06a","#f2a65a","#a8d8a0","#8fc7e8","#f0a0b8"];
const R=["-3deg","2.2deg","-1.4deg","3deg","-2.6deg"];
board.innerHTML=S.projects.map((p,i)=>`<a class="note" href="${p.href}" target="_blank" rel="noreferrer"
  style="background:${PAPER[i%PAPER.length]};--r:${R[i%R.length]}">
  <div class="k">${p.type}</div><h3>${p.t}</h3><p>${p.s}</p><span class="go">visit ↗</span></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d80t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("80");
</script></body></html>
