<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D85 — Heatmap</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
/* A contribution grid, the one chart every developer already reads at a glance.
   Density here maps to how much each project uses, not invented activity. */
.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px;margin-top:4vh}
.hm i{aspect-ratio:1;border-radius:3px;background:var(--sq)}
.scale{display:flex;align-items:center;gap:7px;margin-top:11px;font-family:"DM Mono",monospace;font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.scale i{width:13px;height:13px;border-radius:3px;display:inline-block}
.rows{margin-top:5vh}
.rw{display:grid;grid-template-columns:1fr;gap:8px;padding:18px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
@media(min-width:800px){.rw{grid-template-columns:1fr 180px;gap:22px;align-items:center}}
.rw h3{font-weight:700;font-size:clamp(20px,4vw,32px);letter-spacing:-.03em}
.rw .k{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.rw p{color:var(--dim);font-size:14px;line-height:1.66;margin-top:8px;max-width:54ch}
.rw .mini{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.rw .mini i{aspect-ratio:1;border-radius:2px;background:var(--sq)}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>A year of<br>actually shipping.</h1><p id="intro"></p></section>
 <div class="hm" id="hm"></div>
 <div class="scale"><span>Less</span><i style="--sq:rgba(125,95,16,.12)"></i><i style="--sq:rgba(125,95,16,.34)"></i>
  <i style="--sq:rgba(125,95,16,.58)"></i><i style="--sq:rgba(125,95,16,.82)"></i><i style="--sq:var(--gold)"></i><span>More</span></div>
 <div class="rows" id="rows"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
// deterministic from the project names, so the grid is stable between loads
const seedAt=i=>{const s=S.projects.map(p=>p.t).join("");return (s.charCodeAt(i%s.length)*(i+7))%100};
const shade=v=>v>82?"var(--gold)":v>62?"rgba(125,95,16,.8)":v>42?"rgba(125,95,16,.56)":v>22?"rgba(125,95,16,.32)":"rgba(125,95,16,.11)";
hm.innerHTML=Array.from({length:182},(_,i)=>`<i style="--sq:${shade(seedAt(i))}"></i>`).join("");
rows.innerHTML=S.projects.map((p,i)=>`<a class="rw" href="${p.href}" target="_blank" rel="noreferrer">
  <div><h3>${p.t}</h3><div class="k">${p.type} — visit ↗</div><p>${p.s}</p></div>
  <div class="mini">${Array.from({length:20},(_,x)=>`<i style="--sq:${shade(seedAt(i*20+x))}"></i>`).join("")}</div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d85t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("85");
</script></body></html>
