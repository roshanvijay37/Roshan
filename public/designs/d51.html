<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D51 — Map</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--land:#e6e0cd;--water:#cfd8cf}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--land:#171512;--water:#101614}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Outfit,system-ui,sans-serif}
.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
.map{position:relative;aspect-ratio:4/5;max-height:74vh;margin:4vh 0;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;background:var(--land)}
@media(min-width:820px){.map{aspect-ratio:16/10}}
.map .sea{position:absolute;inset:0;background:
  radial-gradient(80% 60% at 8% 76%,var(--water) 0 42%,transparent 43%),
  radial-gradient(50% 40% at 96% 12%,var(--water) 0 46%,transparent 47%)}
.map .grid2{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px}
.pin{position:absolute;transform:translate(-50%,-100%);text-decoration:none;color:inherit;text-align:center}
.pin i{display:block;width:15px;height:15px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  background:var(--c);margin:0 auto 7px;box-shadow:0 3px 9px rgba(0,0,0,.3);transition:transform .3s}
.pin:hover i{transform:rotate(-45deg) scale(1.35)}
.pin b{font-size:12.5px;font-weight:700;letter-spacing:-.01em;background:var(--bg);padding:3px 7px;border-radius:4px;
  border:1px solid var(--line);white-space:nowrap}
.pin span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.places{display:grid;gap:0;margin-top:2vh}
.pl{display:grid;grid-template-columns:1fr;gap:5px;padding:16px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
@media(min-width:760px){.pl{grid-template-columns:170px 1fr 130px;gap:18px;align-items:baseline}}
.pl .n{font-weight:700;font-size:19px;letter-spacing:-.02em}
.pl .w{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.pl p{color:var(--dim);font-size:13.5px;line-height:1.62}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Built for places<br>I actually know.</h1><p id="intro"></p></section>
 <div class="map" id="map"><div class="sea"></div><div class="grid2"></div></div>
 <div class="places" id="places"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
// Where each of these was actually built for — drawn from the project copy.
const PLACES=[{w:"Online — India",x:74,y:22},{w:"Kateel",x:38,y:40},{w:"Moodbidri",x:60,y:58},
 {w:"Belvai",x:30,y:70},{w:"Belvai",x:46,y:86}];
map.insertAdjacentHTML("beforeend",S.projects.map((p,i)=>`<a class="pin" href="${p.href}" target="_blank" rel="noreferrer"
  style="left:${PLACES[i].x}%;top:${PLACES[i].y}%;--c:${p.c}"><i></i><b>${p.t}</b><span>${PLACES[i].w}</span></a>`).join(""));
places.innerHTML=S.projects.map((p,i)=>`<a class="pl" href="${p.href}" target="_blank" rel="noreferrer">
  <div><div class="n">${p.t}</div><div class="w mono">${PLACES[i].w}</div></div>
  <p>${p.s}</p><div class="w mono">${p.type} ↗</div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d51t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("51");
</script></body></html>
