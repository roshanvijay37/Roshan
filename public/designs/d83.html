<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D83 — Arcade</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0618;--ink:#e9e4ff;--gold:#ffd83d;--pink:#ff5ea8;--cyan:#4de1ff;--dim:#8f88bb;--line:rgba(233,228,255,.2)}
:root[data-theme="light"]{--bg:#efecff;--ink:#0d0820;--gold:#7a5f10;--pink:#c02a6a;--cyan:#0f6f8c;--dim:#5c5680;--line:rgba(13,8,32,.2)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Inter,system-ui,sans-serif;
  background-image:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.13) 3px 4px)}
.px{font-family:"Press Start 2P",monospace;line-height:1.6}
/* A cabinet select screen. The row you are on blinks, arrows step through it,
   and the whole thing is scanlined. */
.hero{padding:17vh 0 3vh;text-align:center}
.hero h1{font-family:"Press Start 2P",monospace;font-size:clamp(15px,4.4vw,34px);line-height:1.5;color:var(--gold);
  text-shadow:3px 3px 0 var(--pink)}
.hero p{margin:18px auto 0;max-width:44ch;color:var(--dim);font-size:14px;line-height:1.75}
.cab{border:3px solid var(--line);border-radius:6px;padding:18px 14px;margin-top:4vh;background:rgba(0,0,0,.22)}
.sel{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--cyan);letter-spacing:.06em;text-align:center;margin-bottom:16px}
.opt{display:block;text-decoration:none;color:inherit;padding:13px 12px;border-radius:4px;
  font-family:"Press Start 2P",monospace;font-size:clamp(9px,2.4vw,13px);line-height:1.7;letter-spacing:.02em}
.opt.on{background:rgba(255,216,61,.14);color:var(--gold)}
.opt.on::before{content:"> ";color:var(--pink)}
.opt .d{font-family:Inter,sans-serif;font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.6}
.ctrl{display:flex;justify-content:center;gap:9px;margin-top:16px}
.ctrl button{background:none;border:2px solid var(--line);color:var(--ink);font-family:"Press Start 2P",monospace;
  font-size:10px;padding:10px 14px;border-radius:4px;cursor:pointer}
.ctrl button:hover{border-color:var(--gold);color:var(--gold)}
.blink{animation:bk 1.1s steps(1) infinite}
@keyframes bk{50%{opacity:.32}}
@media(prefers-reduced-motion:reduce){.blink{animation:none}}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad">
 <section class="hero"><h1>ROSHAN<br>VIJAY</h1><p id="intro"></p></section>
 <div class="cab"><div class="sel blink">— select a build —</div><div id="opts"></div>
  <div class="ctrl"><button id="up">▲</button><button id="dn">▼</button><button id="go">START</button></div></div>
 <section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
opts.innerHTML=S.projects.map((p,i)=>`<a class="opt${i===0?" on":""}" data-i="${i}"
  href="${p.href}" target="_blank" rel="noreferrer">${p.t}
  <span class="d">${p.type} — ${p.s}</span></a>`).join("");
let cur=0;
const items=[...opts.children];
function sel(n){cur=(n+items.length)%items.length;items.forEach((o,x)=>o.classList.toggle("on",x===cur));
  items[cur].scrollIntoView({block:"nearest"});}
up.onclick=()=>sel(cur-1); dn.onclick=()=>sel(cur+1);
go.onclick=()=>window.open(S.projects[cur].href,"_blank","noopener");
addEventListener("keydown",e=>{if(e.key==="ArrowUp")sel(cur-1);if(e.key==="ArrowDown")sel(cur+1);
  if(e.key==="Enter")window.open(S.projects[cur].href,"_blank","noopener")});
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d83t", ALT = "light";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Dark" : "Light"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("83");
</script></body></html>
