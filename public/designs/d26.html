<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D26 — Minimal</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf6;--ink:#1a1810;--gold:#6f5410;--dim:#6c6656;--line:rgba(26,24,16,.16)}
:root[data-theme="dark"]{--bg:#0d0d0a;--ink:#e9e6da;--gold:#d4b976;--dim:#8d8877;--line:rgba(233,230,218,.18)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scroll-behavior:smooth}
body{color:var(--ink);font-family:Newsreader,Georgia,serif;font-size:18px;line-height:1.72;
  -webkit-font-smoothing:antialiased;font-weight:300}
/* Radical restraint. One column, one serif, no cards, no motion, nothing to
   hover. The argument is that the work does not need help. */
main{width:min(100% - 40px,620px);margin:auto;padding:16vh 0 20vh}
h1{font-size:23px;font-weight:400;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--dim);font-size:16px;margin-bottom:44px}
p{margin-bottom:26px;max-width:62ch}
h2{font-size:15px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  margin:52px 0 18px}
ul{list-style:none;padding:0}
li{padding:15px 0;border-bottom:1px solid var(--line)}
li:first-child{border-top:1px solid var(--line)}
li a{color:inherit;text-decoration:none;display:flex;justify-content:space-between;gap:16px;align-items:baseline}
li a:hover .n{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
li .n{font-size:19px}
li .k{color:var(--dim);font-size:14px;white-space:nowrap}
li .d{color:var(--dim);font-size:15.5px;line-height:1.6;margin-top:6px;max-width:58ch}
.svc dt{font-size:18px;margin-top:20px}
.svc dd{margin:5px 0 0;color:var(--dim);font-size:16px;max-width:58ch}
.stack{color:var(--dim);font-size:16px;line-height:2}
a.wa{color:var(--gold)}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--dim);font-size:14.5px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer button{background:none;border:1px solid var(--line);color:var(--gold);font-family:inherit;
  font-size:13px;padding:5px 11px;border-radius:2px;cursor:pointer}
</style></head><body>
<main>
  <h1 id="nb"></h1>
  <div class="sub">Freelance web developer, India. Available for work.</div>
  <p id="intro"></p>
  <h2>Work</h2>
  <ul id="list"></ul>
  <h2>Services</h2>
  <dl class="svc" id="svc"></dl>
  <h2>Built with</h2>
  <div class="stack" id="chips"></div>
  <h2>Contact</h2>
  <p>The fastest way to reach me is <a class="wa" id="wa" href="#">WhatsApp</a>.</p>
  <footer><span id="fn"></span><button id="tt">Dark</button></footer>
</main>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent = S.name; intro.textContent = S.intro; wa.href = S.wa; fn.textContent = S.name;
list.innerHTML = S.projects.map(p => `
  <li><a href="${p.href}" target="_blank" rel="noreferrer">
    <span class="n">${p.t}</span><span class="k">${p.type} ↗</span></a>
    <div class="d">${p.s}</div></li>`).join("");
svc.innerHTML = S.services.map(s => `<dt>${s.t}</dt><dd>${s.b}</dd>`).join("");
chips.textContent = S.skills.join(", ") + ".";
const root = document.documentElement;
try { if (localStorage.getItem("d26t") === "dark") root.setAttribute("data-theme","dark"); } catch {}
const paint = () => tt.textContent = root.getAttribute("data-theme") === "dark" ? "Light" : "Dark"; paint();
tt.onclick = () => { const d = root.getAttribute("data-theme") === "dark";
  if (d) root.removeAttribute("data-theme"); else root.setAttribute("data-theme","dark");
  try { localStorage.setItem("d26t", d ? "light" : "dark"); } catch {} paint(); };
window.switcher("26");
</script></body></html>
