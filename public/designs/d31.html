<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D31 — Split Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1e8;--alt:#141109;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15)}
:root[data-theme="dark"]{--bg:#0b0a07;--alt:#f1ece0;--ink:#f1ece0;--gold:#e6c374;--dim:#8e8776;--line:rgba(241,236,224,.15)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
/* Two halves that behave differently: the left is fixed and swaps colour with
   whichever project is in view; the right scrolls past it. */
.split{display:grid;grid-template-columns:1fr}
@media(min-width:900px){.split{grid-template-columns:42% 58%}}
.left{padding:22vh 24px 8vh;position:relative;transition:background .6s,color .6s}
@media(min-width:900px){.left{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:11vh 40px 40px}}
.left .k{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;opacity:.7}
.left h1{font-weight:700;font-size:clamp(34px,6vw,66px);letter-spacing:-.04em;line-height:1;margin-top:18px}
.left p{margin-top:18px;max-width:38ch;line-height:1.75;font-size:15px;opacity:.78}
.left .now{margin-top:26px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.left .wa{display:inline-block;margin-top:20px;border:1px solid currentColor;color:inherit;text-decoration:none;
  padding:13px 18px;border-radius:99px;font-size:13.5px;font-weight:500;width:max-content}
.left button{position:absolute;top:16px;right:18px;background:none;border:1px solid currentColor;color:inherit;
  font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 10px;cursor:pointer;opacity:.7}
.right{padding:6vh 22px 14vh}
@media(min-width:900px){.right{padding:11vh 44px 16vh}}
.pj{padding:8vh 0;border-bottom:1px solid var(--line)}
.pj .kind{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.pj h2{font-weight:700;font-size:clamp(28px,5.6vw,56px);letter-spacing:-.04em;margin:10px 0 12px;line-height:1.02}
.pj p{color:var(--dim);font-size:15px;line-height:1.72;max-width:52ch}
.pj .band{height:6px;background:var(--c);margin:18px 0}
.pj .st{display:flex;gap:6px;flex-wrap:wrap}
.pj .st span{font-size:10px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.pj a{display:inline-block;margin-top:16px;color:var(--gold);text-decoration:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.blk{padding:7vh 0}
.blk h3{font-weight:700;font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
.sv{padding:14px 0;border-top:1px solid var(--line)}
.sv h4{font-weight:700;font-size:17px}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
</style></head><body>
<div class="split">
  <div class="left" id="left">
    <button id="tt">Dark</button>
    <div><div class="k mono">Freelance web developer</div>
      <h1 id="lh">Roshan Vijay</h1><p id="intro"></p></div>
    <div><div class="now mono" id="now">Scroll the right column</div>
      <a class="wa" id="wa" href="#">Message me on WhatsApp →</a></div>
  </div>
  <div class="right">
    <div id="list"></div>
    <div class="blk"><h3>Services</h3><div id="svc"></div></div>
    <div class="blk"><h3>Built with</h3><div class="chips" id="chips"></div></div>
  </div>
</div>
<script src="shared.js"></script>
<script>
const S=window.SITE; intro.textContent=S.intro; wa.href=S.wa;
list.innerHTML=S.projects.map(p=>`<div class="pj" data-c="${p.c}" data-n="${p.t}" style="--c:${p.c}">
  <div class="kind mono">${p.type}</div><h2>${p.t}</h2><div class="band"></div><p>${p.s}</p>
  <div class="st" style="margin-top:14px">${p.stack.map(x=>`<span class="mono">${x}</span>`).join("")}</div>
  <a class="mono" href="${p.href}" target="_blank" rel="noreferrer">Visit ${p.href.replace("https://","")} ↗</a></div>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
// the left panel takes the colour of whatever is centred on the right
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
  left.style.background=e.target.dataset.c; left.style.color="#fff";
  now.textContent="Now viewing — "+e.target.dataset.n;}}),{rootMargin:"-45% 0px -45% 0px"});
document.querySelectorAll(".pj").forEach(el=>io.observe(el));
const root=document.documentElement;
try{if(localStorage.getItem("d31t")==="dark")root.setAttribute("data-theme","dark")}catch{}
const paint=()=>tt.textContent=root.getAttribute("data-theme")==="dark"?"Light":"Dark";paint();
tt.onclick=()=>{const d=root.getAttribute("data-theme")==="dark";
  if(d)root.removeAttribute("data-theme");else root.setAttribute("data-theme","dark");
  try{localStorage.setItem("d31t",d?"light":"dark")}catch{}paint()};
window.switcher("31");
</script></body></html>
