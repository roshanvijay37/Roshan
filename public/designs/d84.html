<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D84 — X-Ray</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a12;--ink:#dbe9f7;--gold:#6ec6ff;--dim:#7d93ad;--line:rgba(219,233,247,.18)}
:root[data-theme="light"]{--bg:#eef4fa;--ink:#04101c;--gold:#0e5f8f;--dim:#4c5f73;--line:rgba(4,16,28,.18)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:"Space Grotesk",system-ui,sans-serif}
/* Move the lens and it shows the layer underneath — the stack behind the
   surface. Literally showing how something is built. */
.plate{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:4vh;
  aspect-ratio:4/3;cursor:crosshair;touch-action:pan-y}
@media(min-width:860px){.plate{aspect-ratio:16/8}}
.plate .surface,.plate .under{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.plate .surface{background:var(--c)}
.plate .surface b{color:rgba(255,255,255,.97);font-weight:700;font-size:clamp(24px,5.4vw,52px);letter-spacing:-.035em}
.plate .under{background:var(--bg);
  -webkit-mask-image:radial-gradient(circle 122px at var(--x,50%) var(--y,50%),#000 0 58%,transparent 76%);
  mask-image:radial-gradient(circle 122px at var(--x,50%) var(--y,50%),#000 0 58%,transparent 76%)}
.plate .under .in{border:1px dashed var(--gold);border-radius:10px;padding:16px 18px}
.plate .under .k{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.plate .under .st{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.plate .under .st span{font-family:"DM Mono",monospace;font-size:11px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--dim)}
.picker{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.picker button{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:12px;
  padding:8px 13px;border-radius:99px;cursor:pointer}
.picker button.on{background:var(--c2);color:#fff;border-color:transparent}
.det{margin-top:20px;color:var(--dim);font-size:14.5px;line-height:1.72;max-width:56ch}
.hint{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:10px}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Look<br>through it.</h1><p id="intro"></p></section>
 <div class="plate" id="plate"><div class="surface" id="surf"></div><div class="under" id="und"></div></div>
 <div class="hint">Move over the plate</div>
 <div class="picker" id="picker"></div><div class="det" id="det"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
let cur=0;
function show(i){cur=i;const p=S.projects[i];
  plate.style.setProperty("--c",p.c);
  surf.innerHTML=`<b>${p.t}</b>`;
  und.innerHTML=`<div class="in"><div class="k">Underneath</div>
   <div class="st">${p.stack.map(x=>`<span>${x}</span>`).join("")}</div></div>`;
  det.innerHTML=`<b>${p.t}</b> — ${p.s} <a href="${p.href}" target="_blank" rel="noreferrer" style="color:var(--gold)">Visit ↗</a>`;
  picker.querySelectorAll("button").forEach((b,n)=>{b.classList.toggle("on",n===i);b.style.setProperty("--c2",S.projects[n].c)});}
picker.innerHTML=S.projects.map((p,i)=>`<button data-i="${i}">${p.t}</button>`).join("");
picker.querySelectorAll("button").forEach(b=>b.onclick=()=>show(+b.dataset.i));
show(0);
const move=(cx,cy)=>{const r=plate.getBoundingClientRect();
  und.style.setProperty("--x",(cx-r.left)+"px");und.style.setProperty("--y",(cy-r.top)+"px")};
plate.addEventListener("pointermove",e=>move(e.clientX,e.clientY));
// touch has no hover, so the lens sweeps on its own until it is touched
if(!matchMedia("(pointer:fine)").matches){let t=0;
 (function l(){t+=.012;const r=plate.getBoundingClientRect();
  move(r.left+r.width*(.5+Math.cos(t)*.3),r.top+r.height*(.5+Math.sin(t*1.3)*.3));requestAnimationFrame(l)})();}
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d84t", ALT = "light";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Dark" : "Light"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("84");
</script></body></html>
