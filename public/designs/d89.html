<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D89 — Forecast</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--card:#fbf8f0}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--card:#13110b}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
/* A weather panel: a big current condition, then a strip of days. Reads as a
   glanceable status board rather than a portfolio, which is the point. */
.now{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px 26px;margin-top:4vh;
  display:grid;gap:16px}
@media(min-width:800px){.now{grid-template-columns:1fr 260px;align-items:center}}
.now .k{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.now h2{font-weight:700;font-size:clamp(28px,6.4vw,58px);letter-spacing:-.04em;margin:9px 0 8px;line-height:1.02}
.now p{color:var(--dim);font-size:14.5px;line-height:1.7;max-width:46ch}
.now .big{text-align:center}
.now .big b{display:block;font-size:clamp(44px,11vw,86px);font-weight:700;letter-spacing:-.05em;line-height:1;color:var(--gold)}
.now .big span{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(140px,1fr);gap:10px;overflow-x:auto;
  margin-top:14px;scrollbar-width:none;padding-bottom:4px}
.days::-webkit-scrollbar{display:none}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 13px 16px;
  text-decoration:none;color:inherit;border-top:4px solid var(--c);transition:.24s}
.day:hover{transform:translateY(-3px)}
.day .d{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.day h4{font-weight:700;font-size:16px;letter-spacing:-.02em;margin:7px 0 5px;line-height:1.2}
.day p{color:var(--dim);font-size:12px;line-height:1.5}
.day .t{font-weight:700;font-size:22px;margin-top:9px;letter-spacing:-.03em}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Outlook:<br>shipping.</h1><p id="intro"></p></section>
 <div class="now" id="now"></div><div class="days" id="days"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
const f=S.projects[0];
now.innerHTML=`<div><div class="k">Current conditions</div><h2>${f.t}</h2><p>${f.s}</p>
  <a href="${f.href}" target="_blank" rel="noreferrer" style="display:inline-block;margin-top:12px;color:var(--gold);
   font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none">Visit ↗</a></div>
 <div class="big"><b>5</b><span>live · steady</span></div>`;
days.innerHTML=S.projects.map(p=>`<a class="day" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <div class="d">${p.type}</div><h4>${p.t}</h4><p>${p.stack.slice(0,3).join(" · ")}</p>
  <div class="t">Live</div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d89t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("89");
</script></body></html>
