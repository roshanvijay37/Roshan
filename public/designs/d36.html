<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D36 — Circuit</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--trace:#7d5f10}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--trace:#e6c374}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Inter,system-ui,sans-serif;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:22px 22px}
.hero{padding:19vh 0 5vh}
.hero h1{font-family:"Space Mono",monospace;font-weight:700;font-size:clamp(30px,7.4vw,76px);letter-spacing:-.03em;line-height:1.04}
.hero p{margin-top:18px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
/* Components on a board, joined by traces. Each project is a chip with pins. */
.board{display:grid;gap:0;padding:4vh 0}
.node{position:relative;padding:0 0 54px 0;text-decoration:none;color:inherit;display:block}
.node .trace{position:absolute;left:26px;top:52px;bottom:0;width:2px;background:var(--trace);opacity:.5}
.node:last-child .trace{display:none}
.chip{border:2px solid var(--ink);background:var(--bg);border-radius:5px;padding:14px 16px;position:relative;
  box-shadow:4px 4px 0 var(--line);transition:.25s}
.node:hover .chip{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--trace)}
.chip::before{content:"";position:absolute;left:-8px;top:16px;width:8px;height:5px;background:var(--trace)}
.chip::after{content:"";position:absolute;right:-8px;bottom:16px;width:8px;height:5px;background:var(--trace)}
.chip .pin{position:absolute;left:14px;top:-7px;width:11px;height:7px;background:var(--c);border-radius:2px 2px 0 0}
.chip .id{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.chip h3{font-family:"Space Mono",monospace;font-weight:700;font-size:clamp(19px,3.8vw,30px);letter-spacing:-.02em;margin:6px 0 7px}
.chip p{color:var(--dim);font-size:13.5px;line-height:1.65;max-width:52ch}
.chip .st{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.chip .st span{font-family:"Space Mono",monospace;font-size:10px;border:1px solid var(--line);padding:4px 7px}
.chip .go{display:inline-block;margin-top:10px;font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>&gt; five_things.live</h1><p id="intro"></p></section>
 <div class="board" id="board"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
board.innerHTML=S.projects.map(p=>`<a class="node" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <span class="trace"></span><div class="chip"><span class="pin"></span>
  <div class="id">${p.type}</div><h3>${p.t}</h3><p>${p.s}</p>
  <div class="st">${p.stack.map(x=>`<span>${x}</span>`).join("")}</div>
  <span class="go">visit ${p.href.replace("https://","")} ↗</span></div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d36t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("36");
</script></body></html>
