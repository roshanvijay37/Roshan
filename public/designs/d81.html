<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D81 — Radio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1a13;--face:#2a251b;--ink:#f0e7d2;--gold:#e8b64c;--dim:#9a9078;--line:rgba(240,231,210,.18)}
:root[data-theme="light"]{--bg:#efe9da;--face:#f8f3e6;--ink:#1c1810;--gold:#8a5f10;--dim:#6a6152;--line:rgba(28,24,16,.2)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
.hero h1{font-family:Oswald,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.01em}
/* A tuner. Drag the needle across the band and the station — the project —
   changes. The dial is the navigation; there is nothing else to click. */
.set{background:var(--face);border:1px solid var(--line);border-radius:14px;padding:20px 18px 24px;margin-top:4vh;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.28)}
.band{position:relative;height:64px;border-radius:8px;background:linear-gradient(180deg,rgba(0,0,0,.16),transparent);
  border:1px solid var(--line);overflow:hidden;cursor:ew-resize;touch-action:pan-y}
.ticks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 22px);opacity:.7}
.marks{position:absolute;inset:0}
.marks span{position:absolute;top:7px;transform:translateX(-50%);font-family:"DM Mono",monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.needle{position:absolute;top:0;bottom:0;width:3px;background:var(--gold);box-shadow:0 0 12px var(--gold);left:10%}
.readout{margin-top:18px;display:grid;gap:10px}
.readout .k{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.readout h3{font-family:Oswald,sans-serif;font-weight:600;font-size:clamp(24px,5.4vw,44px);text-transform:uppercase;letter-spacing:.01em;line-height:1}
.readout p{color:var(--dim);font-size:14.5px;line-height:1.7;max-width:52ch}
.readout .st{display:flex;gap:6px;flex-wrap:wrap}
.readout .st span{font-family:"DM Mono",monospace;font-size:10px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--dim)}
.readout a{display:inline-block;background:var(--gold);color:#1a1408;text-decoration:none;padding:12px 18px;
  border-radius:6px;font-weight:600;font-size:13.5px;width:max-content}
.hint{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:10px}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Tune in.</h1><p id="intro"></p></section>
 <div class="set"><div class="band" id="band"><div class="ticks"></div><div class="marks" id="marks"></div>
  <div class="needle" id="needle"></div></div>
  <div class="hint">Drag the dial</div><div class="readout" id="out"></div></div>
 <section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
const N=S.projects.length;
marks.innerHTML=S.projects.map((p,i)=>`<span style="left:${((i+.5)/N)*100}%">${p.t.split(" ")[0]}</span>`).join("");
function tune(f){
  const i=Math.max(0,Math.min(N-1,Math.floor(f*N)));
  needle.style.left=(f*100)+"%";
  const p=S.projects[i];
  out.innerHTML=`<div class="k">${p.type} — ${p.href.replace("https://","")}</div><h3>${p.t}</h3><p>${p.s}</p>
   <div class="st">${p.stack.map(x=>`<span>${x}</span>`).join("")}</div>
   <a href="${p.href}" target="_blank" rel="noreferrer">Visit live site ↗</a>`;
}
let drag=false;
const set=cx=>{const r=band.getBoundingClientRect();tune(Math.max(0,Math.min(1,(cx-r.left)/r.width)))};
band.addEventListener("pointerdown",e=>{drag=true;band.setPointerCapture(e.pointerId);set(e.clientX)});
band.addEventListener("pointermove",e=>{if(drag)set(e.clientX)});
const up=()=>drag=false;
band.addEventListener("pointerup",up);band.addEventListener("pointercancel",up);
tune(.1);
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d81t", ALT = "light";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Dark" : "Light"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("81");
</script></body></html>
