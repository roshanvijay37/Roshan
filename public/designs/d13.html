<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D13 — Terminal</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b09;--ink:#e8e3d4;--gold:#e6c374;--dim:#8b8574;--line:rgba(232,227,212,.14);--ok:#a3c46b}
:root[data-theme="light"]{--bg:#f6f3ea;--ink:#16130c;--gold:#7d5f10;--dim:#6a6353;--line:rgba(22,19,12,.15);--ok:#4e7a20}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
.pad{width:min(100% - 24px,980px);margin:auto;padding:26px 0 110px}

/* A terminal, because that is the room this person actually works in. No other
   portfolio look says "engineer" without having to claim it in a sentence. */
.win{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);
  box-shadow:0 24px 60px rgba(0,0,0,.28)}
.chrome{display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chrome i{width:9px;height:9px;border-radius:50%;background:rgba(140,134,116,.45)}
.chrome .title{margin-left:8px;font-size:11px;color:var(--dim);letter-spacing:.04em}
.chrome button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--gold);
  font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border-radius:4px;padding:5px 9px;cursor:pointer}
.screen{padding:18px 16px 26px;min-height:74svh}
@media(min-width:760px){.screen{padding:26px 26px 34px}}
.ln{white-space:pre-wrap;word-break:break-word}
.pr{color:var(--gold)}
.cmd{color:var(--ink);font-weight:500}
.mut{color:var(--dim)}
.ok{color:var(--ok)}
.big{font-size:clamp(19px,4.6vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:6px 0 2px}
.blk{margin:16px 0 22px}
a{color:var(--gold)}
.row{display:grid;grid-template-columns:1fr;gap:2px;padding:12px 0;border-bottom:1px dashed var(--line)}
.row .nm{font-weight:700;font-size:15px}
.row .nm a{text-decoration:none}
.row .nm a:hover{text-decoration:underline}
.row .meta{color:var(--dim);font-size:12px}
.caret{display:inline-block;width:9px;height:1.05em;background:var(--gold);vertical-align:-3px;animation:bl 1.05s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hintbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hintbar button{background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:11.5px;
  border-radius:5px;padding:9px 12px;cursor:pointer;transition:.2s}
.hintbar button:hover{border-color:var(--gold);color:var(--gold)}
.wa{display:inline-block;margin-top:8px;background:var(--gold);color:#141008;text-decoration:none;
  padding:12px 18px;border-radius:6px;font-weight:700;font-size:13px}
@media(prefers-reduced-motion:reduce){.caret{animation:none}}
</style>
</head>
<body>
<div class="pad">
  <div class="win">
    <div class="chrome">
      <i></i><i></i><i></i>
      <span class="title" id="ttl"></span>
      <button id="tt">Light</button>
    </div>
    <div class="screen" id="scr"></div>
  </div>
  <div class="hintbar" id="hints"></div>
</div>

<script src="shared.js"></script>
<script>
const S = window.SITE;
ttl.textContent = S.name.toLowerCase().replace(" ", "-") + " — zsh";

const scr = document.getElementById("scr");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function line(html, cls){ const d = document.createElement("div"); d.className = "ln " + (cls||""); d.innerHTML = html; scr.appendChild(d); return d; }
function blank(){ line("&nbsp;"); }

// Commands are the navigation. Each one prints a real part of the portfolio.
const CMDS = {
  whoami(){
    line('<span class="big">Roshan Vijay</span>');
    line('<span class="mut">Freelance web developer — India. Available.</span>');
    blank();
    line(S.intro);
  },
  work(){
    line('<span class="mut">Every one of these is live. Click it.</span>'); blank();
    S.projects.forEach(p => {
      const d = document.createElement("div"); d.className = "row";
      d.innerHTML = `<div class="nm"><a href="${p.href}" target="_blank" rel="noreferrer">${p.t} ↗</a></div>
        <div class="meta">${p.type} — ${p.href.replace("https://","")}</div>
        <div class="meta">${p.s}</div>
        <div class="meta mut">${p.stack.join(" · ")}</div>`;
      scr.appendChild(d);
    });
  },
  services(){
    S.services.forEach(s => { line(`<span class="ok">▸</span> <b>${s.t}</b>`); line(`<span class="mut">  ${s.b}</span>`); blank(); });
  },
  stack(){
    line('<span class="mut">' + S.skills.join("  ·  ") + '</span>');
  },
  contact(){
    line('<span class="mut">Fastest route is WhatsApp.</span>');
    line(`<a class="wa" href="${S.wa}" target="_blank" rel="noreferrer">Message me on WhatsApp →</a>`);
  },
  help(){
    line('<span class="mut">Available: whoami · work · services · stack · contact · clear</span>');
  },
  clear(){ scr.innerHTML = ""; },
};

function prompt(cmd){
  line(`<span class="pr">roshan@web</span> <span class="mut">~</span> $ <span class="cmd">${cmd}</span>`);
}

async function type(cmd){
  const d = line(`<span class="pr">roshan@web</span> <span class="mut">~</span> $ <span class="cmd"></span><span class="caret"></span>`);
  if (reduced) { d.querySelector(".cmd").textContent = cmd; d.querySelector(".caret").remove(); return; }
  const target = d.querySelector(".cmd");
  for (const ch of cmd) { target.textContent += ch; await new Promise(r => setTimeout(r, 42)); }
  await new Promise(r => setTimeout(r, 220));
  d.querySelector(".caret").remove();
}

function run(cmd, typed){
  if (!CMDS[cmd]) { prompt(cmd); line(`<span class="mut">command not found: ${cmd} — try help</span>`); blank(); return; }
  if (!typed) prompt(cmd);
  CMDS[cmd]();
  if (cmd !== "clear") blank();
  scr.parentElement.scrollIntoView({ block: "nearest" });
}

// hint buttons double as the nav, so nobody has to guess at a blank prompt
hints.innerHTML = ["whoami","work","services","stack","contact","clear"]
  .map(c => `<button data-c="${c}">${c}</button>`).join("");
hints.querySelectorAll("button").forEach(b => b.onclick = () => run(b.dataset.c));

(async function boot(){
  await type("whoami"); CMDS.whoami(); blank();
  await type("work"); CMDS.work(); blank();
  line('<span class="mut">Type below or tap a command.</span>');
  line(`<span class="pr">roshan@web</span> <span class="mut">~</span> $ <span class="caret"></span>`);
})();

const root = document.documentElement;
try { if (localStorage.getItem("d13theme") === "light") root.setAttribute("data-theme","light"); } catch {}
const paint = () => tt.textContent = root.getAttribute("data-theme") === "light" ? "Dark" : "Light";
paint();
tt.onclick = () => { const l = root.getAttribute("data-theme") === "light";
  if (l) root.removeAttribute("data-theme"); else root.setAttribute("data-theme","light");
  try { localStorage.setItem("d13theme", l ? "dark" : "light"); } catch {} paint(); };

window.switcher("13");
</script>
</body>
</html>
