<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D46 — Radial</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a08;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="light"]{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Outfit,system-ui,sans-serif}
.hero{padding:18vh 0 2vh;text-align:center}
.hero h1{font-weight:900;font-size:clamp(28px,7vw,72px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin:16px auto 0;max-width:44ch;color:var(--dim);line-height:1.75;font-size:15px}
/* A dial. The five projects sit around a ring and the middle shows whichever is
   selected — the whole portfolio fits one screen with no scrolling. */
.dial{position:relative;width:min(92vw,520px);aspect-ratio:1;margin:4vh auto 2vh}
.ring{position:absolute;inset:0;border:1px dashed var(--line);border-radius:50%}
.node{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;
  border:2px solid var(--line);background:var(--bg);color:inherit;font:inherit;cursor:pointer;
  display:grid;place-items:center;font-size:11px;font-weight:700;text-align:center;padding:4px;line-height:1.15;transition:.3s}
.node.on{border-color:var(--c);background:var(--c);color:#fff;transform:scale(1.12)}
.hubwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;text-align:center}
.hub .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.hub h3{font-weight:900;font-size:clamp(19px,4vw,32px);letter-spacing:-.03em;margin:7px 0 8px;line-height:1.05}
.hub p{color:var(--dim);font-size:12.5px;line-height:1.58}
.hub .st{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:9px}
.hub .st span{font-size:9.5px;border:1px solid var(--line);padding:4px 6px;border-radius:99px;color:var(--dim)}
.hub a{display:inline-block;margin-top:10px;color:var(--gold);font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Pick a project.</h1><p id="intro"></p></section>
 <div class="dial" id="dial"><div class="ring"></div><div class="hubwrap"><div class="hub" id="hub"></div></div></div>
 <section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
const dial=document.getElementById("dial");
S.projects.forEach((p,i)=>{
  const a=(i/S.projects.length)*Math.PI*2-Math.PI/2;
  const b=document.createElement("button");
  b.className="node";b.style.setProperty("--c",p.c);
  b.style.left=(50+Math.cos(a)*42)+"%";b.style.top=(50+Math.sin(a)*42)+"%";
  b.textContent=p.t.split(" ")[0];
  b.onclick=()=>pick(i);
  dial.appendChild(b);
});
function pick(i){
  const p=S.projects[i];
  dial.querySelectorAll(".node").forEach((n,x)=>n.classList.toggle("on",x===i));
  hub.innerHTML=`<div class="k mono">${p.type}</div><h3>${p.t}</h3><p>${p.s}</p>
    <div class="st">${p.stack.map(x=>`<span class="mono">${x}</span>`).join("")}</div>
    <a class="mono" href="${p.href}" target="_blank" rel="noreferrer">Visit ↗</a>`;
}
pick(0);
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d46t", ALT = "light";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Dark" : "Light"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("46");
</script></body></html>
