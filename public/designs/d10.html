<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D10 — Preloader + Overlay Menu</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6e9;--ink:#15110a;--gold:#8a6a14;--dim:#6d6450;--line:rgba(21,17,10,.14)}
:root[data-theme="dark"]{--bg:#0b0906;--ink:#f3ebd9;--gold:#e6c374;--dim:#948a73;--line:rgba(243,235,217,.13)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);font-family:Syne,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 30px,1180px);margin:auto}
[data-r]{opacity:0;transform:translateY(24px);transition:all .9s cubic-bezier(.2,.75,.2,1)}
[data-r="in"]{opacity:1;transform:none}

/* ---- the preloader: a counter, then a curtain wipe ---- */
#pre{position:fixed;inset:0;z-index:200;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;transition:clip-path 1.1s cubic-bezier(.76,0,.24,1)}
#pre.done{clip-path:inset(0 0 100% 0)}
#pre .n{font-weight:800;font-size:clamp(64px,22vw,240px);letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
#pre .cap{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;opacity:.6}
#pre .bar{position:absolute;bottom:0;left:0;height:3px;background:var(--gold);width:0}

/* ---- overlay menu ---- */
#menu{position:fixed;inset:0;z-index:150;background:var(--ink);color:var(--bg);
  clip-path:circle(0% at calc(100% - 44px) 42px);transition:clip-path .8s cubic-bezier(.76,0,.24,1);
  display:grid;align-content:center;padding:0 8vw}
#menu.open{clip-path:circle(150% at calc(100% - 44px) 42px)}
#menu a{color:inherit;text-decoration:none;font-weight:800;letter-spacing:-.04em;
  font-size:clamp(38px,11vw,110px);line-height:1.06;display:block;opacity:.55;transition:opacity .3s,transform .5s}
#menu a:hover{opacity:1;transform:translateX(14px)}
#menu .meta{margin-top:44px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.5}

nav{position:fixed;z-index:160;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:18px 20px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;mix-blend-mode:difference;color:#fff}
nav button{background:none;border:0;color:inherit;font:inherit;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:8px}

.hero{min-height:100svh;display:grid;align-content:center;padding:20vh 0 12vh}
.hero .k{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:24px}
.hero h1{font-weight:800;font-size:clamp(46px,12vw,150px);line-height:.9;letter-spacing:-.05em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin-top:30px;max-width:48ch;color:var(--dim);line-height:1.8;font-size:15.5px}

.sec{padding:12vh 0}
.lab{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
.sec h2{font-weight:800;font-size:clamp(30px,6.4vw,68px);letter-spacing:-.04em;line-height:1}
.item{display:block;text-decoration:none;color:inherit;border-top:1px solid var(--line);padding:26px 0;position:relative;overflow:hidden}
.item h3{font-weight:800;font-size:clamp(26px,6vw,52px);letter-spacing:-.04em;line-height:1.04}
.item .t{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:10px}
.item p{color:var(--dim);font-size:14px;line-height:1.7;margin-top:12px;max-width:56ch}
.item .wipe{position:absolute;inset:0;background:var(--c);transform:scaleY(0);transform-origin:bottom;transition:transform .5s cubic-bezier(.76,0,.24,1);z-index:-1;opacity:.16}
.item:hover .wipe{transform:scaleY(1)}
.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:5vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:2px solid var(--ink);padding:20px 0 24px}
.sv h4{font-weight:700;font-size:20px;margin:0 0 9px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5vh}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:8px 10px;border-radius:99px;color:var(--dim)}
.cta{padding:14vh 0 16vh;text-align:center}
.cta h2{font-weight:800;font-size:clamp(34px,9vw,110px);letter-spacing:-.05em;line-height:.96}
.btn{display:inline-block;margin-top:30px;background:var(--ink);color:var(--bg);text-decoration:none;padding:18px 28px;border-radius:99px;font-weight:700;font-size:14px}
@media(prefers-reduced-motion:reduce){#pre{display:none}}
</style>
</head>
<body>
<div id="pre"><div class="n mono" id="cnt">00</div><div class="cap mono">Loading</div><div class="bar" id="bar"></div></div>

<div id="menu">
  <a href="#work">Work</a><a href="#services">Services</a><a href="#contact">Contact</a>
  <div class="meta mono" id="mmeta"></div>
</div>

<nav><span class="mono" id="nb"></span><button id="mt" class="mono" aria-expanded="false">Menu</button></nav>

<div class="pad">
  <section class="hero">
    <div class="k mono">Freelance web developer</div>
    <h1>I engineer ideas into <em>impact.</em></h1>
    <p id="intro"></p>
  </section>

  <section class="sec" id="work">
    <div class="lab mono">Selected work</div>
    <h2 data-r>All of it live.</h2>
    <div id="list" style="margin-top:5vh"></div>
  </section>

  <section class="sec" id="services">
    <div class="lab mono">Services</div>
    <h2 data-r>What you can buy.</h2>
    <div class="grid" id="svc"></div>
    <div class="chips" id="chips" data-r></div>
  </section>

  <section class="cta" id="contact" data-r>
    <h2>Have an idea?</h2>
    <a class="btn" id="wa" href="#">Message me on WhatsApp →</a>
  </section>
</div>

<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent = S.name; intro.textContent = S.intro; wa.href = S.wa;
mmeta.textContent = "Available for freelance — India";

list.innerHTML = S.projects.map(p => `
  <a class="item" href="${p.href}" target="_blank" rel="noreferrer" data-r style="--c:${p.c}">
    <span class="wipe"></span>
    <h3>${p.t}</h3><div class="t mono">${p.type} ↗</div><p>${p.s}</p>
  </a>`).join("");
svc.innerHTML = S.services.map(s => `<div class="sv" data-r><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML = S.skills.map(t => `<span class="mono">${t}</span>`).join("");

// preloader: count to 100, then wipe
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { pre.remove(); return; }
  let n = 0;
  const tick = setInterval(() => {
    n = Math.min(100, n + Math.ceil(Math.random() * 9));
    cnt.textContent = String(n).padStart(2, "0");
    bar.style.width = n + "%";
    if (n >= 100) {
      clearInterval(tick);
      setTimeout(() => { pre.classList.add("done"); setTimeout(() => pre.remove(), 1200); }, 260);
    }
  }, 90);
})();

// overlay menu
mt.addEventListener("click", () => {
  const open = menu.classList.toggle("open");
  mt.textContent = open ? "Close" : "Menu";
  mt.setAttribute("aria-expanded", String(open));
});
menu.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
  menu.classList.remove("open"); mt.textContent = "Menu"; mt.setAttribute("aria-expanded", "false");
}));

window.reveal(); window.switcher("10");
</script>
</body>
</html>
