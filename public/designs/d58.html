<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D58 — Trading Cards</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--foil:linear-gradient(120deg,#e6c374,#fff3d6 42%,#b8873b)}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:"Chakra Petch",system-ui,sans-serif}
/* Cards with stats. The numbers here are honest counts of what the project
   uses, not invented ratings. */
.deck{display:grid;gap:16px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:680px){.deck{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1020px){.deck{grid-template-columns:repeat(3,1fr)}}
.tc{border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--bg);text-decoration:none;color:inherit;
  transition:transform .3s,box-shadow .3s;position:relative}
.tc:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 22px 44px rgba(0,0,0,.2)}
.tc .top{background:var(--c);padding:14px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tc .top b{color:rgba(255,255,255,.97);font-weight:700;font-size:19px;letter-spacing:-.02em}
.tc .top span{background:rgba(255,255,255,.9);color:#141005;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;padding:4px 8px;border-radius:99px;white-space:nowrap}
.tc .art{height:104px;background:var(--foil);display:grid;place-items:center}
.tc .art i{font-family:"DM Mono",monospace;font-style:normal;font-size:34px;color:#13100a;font-weight:700}
.tc .in{padding:13px 15px 16px}
.tc p{color:var(--dim);font-size:13px;line-height:1.6;min-height:62px}
.tc .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}
.tc .stats div{border:1px solid var(--line);border-radius:7px;padding:7px;text-align:center}
.tc .stats b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.tc .stats span{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tc .go{display:block;margin-top:11px;text-align:center;background:var(--ink);color:var(--bg);
  padding:9px;border-radius:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Collect the set.</h1><p id="intro"></p></section><div class="deck" id="deck"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
deck.innerHTML=S.projects.map(p=>`<a class="tc" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <div class="top"><b>${p.t}</b><span>Live</span></div>
  <div class="art"><i>${p.t[0]}</i></div>
  <div class="in"><p>${p.s}</p>
   <div class="stats"><div><b>${p.stack.length}</b><span>Tools</span></div>
    <div><b>${p.t.length}</b><span>Chars</span></div>
    <div><b>${p.type.split(" ").length}</b><span>Words</span></div></div>
   <span class="go mono">Visit ↗</span></div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d58t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("58");
</script></body></html>
