<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D94 — Cassette</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--shell:#e7dcc4;--label:#faf5e6}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--shell:#1e1a12;--label:#161208}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
.hero h1{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(32px,9vw,92px);line-height:.94}
/* A shelf of tapes. Handwritten labels, two reels, a window — and a tracklist
   beneath. The object is doing the sorting for you. */
.rack{display:grid;gap:18px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:680px){.rack{grid-template-columns:repeat(2,1fr)}}
.cas{background:var(--shell);border:1px solid var(--line);border-radius:9px;padding:12px;text-decoration:none;color:inherit;
  box-shadow:0 12px 28px rgba(0,0,0,.16);transition:.26s}
.cas:hover{transform:translateY(-4px)}
.cas .label{background:var(--label);border:1px solid var(--line);border-radius:4px;padding:12px 13px;position:relative}
.cas .label::after{content:"";position:absolute;left:12px;right:12px;top:52%;height:1px;background:var(--line)}
.cas .side{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.cas h3{font-family:Anton,sans-serif;text-transform:uppercase;font-size:23px;letter-spacing:.01em;margin:6px 0 5px;line-height:1.05}
.cas p{color:var(--dim);font-size:12.5px;line-height:1.55;position:relative;z-index:2}
.cas .reels{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;padding:0 8px}
.cas .reel{width:46px;height:46px;border-radius:50%;border:5px solid var(--line);background:var(--label);position:relative}
.cas .reel::after{content:"";position:absolute;inset:11px;border-radius:50%;border:2px solid var(--c)}
.cas .win{flex:1;height:22px;border-radius:3px;background:rgba(0,0,0,.16);border:1px solid var(--line)}
.cas .st{font-family:"DM Mono",monospace;font-size:10px;color:var(--dim);margin-top:10px;text-align:center;letter-spacing:.08em}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Side A:<br>the work.</h1><p id="intro"></p></section>
 <div class="rack" id="rack"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
rack.innerHTML=S.projects.map((p,i)=>`<a class="cas" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <div class="label"><div class="side">Side ${String.fromCharCode(65+i)} — ${p.type}</div>
   <h3>${p.t}</h3><p>${p.s}</p></div>
  <div class="reels"><span class="reel"></span><span class="win"></span><span class="reel"></span></div>
  <div class="st">${p.stack.join(" / ")}</div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d94t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("94");
</script></body></html>
