<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D88 — Luggage</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--tag:#f6f0e0}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--tag:#16130c}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
.hero h1{font-family:Oswald,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.01em}
/* Baggage tags on a rail — punched hole, string, barcode. Hangs rather than
   sits, which is a different silhouette from every card layout here. */
.rail{border-top:2px solid var(--line);margin-top:6vh;display:flex;flex-wrap:wrap;gap:26px;padding-top:0;justify-content:center}
.tag{width:min(90%,250px);background:var(--tag);border:1px solid var(--line);border-radius:8px;padding:26px 16px 18px;
  position:relative;margin-top:34px;text-decoration:none;color:inherit;transform:rotate(var(--r));
  transform-origin:50% -34px;box-shadow:0 10px 24px rgba(0,0,0,.14);transition:transform .4s}
.tag:hover{transform:rotate(0)}
.tag::before{content:"";position:absolute;top:-34px;left:50%;width:2px;height:34px;background:var(--line);transform:translateX(-50%)}
.tag::after{content:"";position:absolute;top:11px;left:50%;width:15px;height:15px;border-radius:50%;
  border:2px solid var(--line);background:var(--bg);transform:translateX(-50%)}
.tag .code{font-family:Oswald,sans-serif;font-size:30px;font-weight:600;letter-spacing:.05em;text-align:center;color:var(--c)}
.tag .k{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-align:center;margin-top:4px}
.tag h3{font-size:18px;font-weight:700;margin:12px 0 6px;letter-spacing:-.02em}
.tag p{color:var(--dim);font-size:12.5px;line-height:1.58}
.tag .bc{margin-top:12px;height:34px;
  background-image:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px)}
.tag .no{font-family:"DM Mono",monospace;font-size:10px;text-align:center;color:var(--dim);margin-top:5px;letter-spacing:.14em}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Checked in.<br>All arrived.</h1><p id="intro"></p></section>
 <div class="rail" id="rail"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
const R=["-4deg","3deg","-2deg","4deg","-3deg"];
rail.innerHTML=S.projects.map((p,i)=>{const c=p.t.replace(/[^A-Za-z]/g,"").slice(0,3).toUpperCase();
 return `<a class="tag" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c};--r:${R[i%R.length]}">
  <div class="code">${c}</div><div class="k">${p.type}</div>
  <h3>${p.t}</h3><p>${p.s}</p><div class="bc"></div>
  <div class="no">${p.href.replace("https://","")}</div></a>`}).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d88t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("88");
</script></body></html>
