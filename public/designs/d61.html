<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D61 — Zoom</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Sora,system-ui,sans-serif}
/* Scroll drives a camera pushing inward: each project scales up from a point
   and passes you, rather than sliding by. */
.zw{height:420vh;position:relative}
.zs{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
.zc{position:absolute;width:min(84vw,520px);border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:var(--bg);box-shadow:0 26px 60px rgba(0,0,0,.28);will-change:transform,opacity;text-decoration:none;color:inherit}
.zc .face{background:var(--c);min-height:132px;display:grid;place-items:center;padding:18px}
.zc .face b{color:rgba(255,255,255,.96);font-weight:800;font-size:clamp(22px,4.6vw,38px);letter-spacing:-.03em;text-align:center}
.zc .in{padding:15px 17px 19px}
.zc .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.zc p{color:var(--dim);font-size:13.5px;line-height:1.65;margin-top:8px}
.zc .go{display:inline-block;margin-top:11px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hint{position:absolute;bottom:7vh;left:50%;transform:translateX(-50%);font-family:"DM Mono",monospace;
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.hero{padding:19vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
@media(prefers-reduced-motion:reduce){.zw{height:auto}.zs{position:static;height:auto;display:grid;gap:16px;padding:4vh 0}
 .zc{position:relative;transform:none!important;opacity:1!important;width:100%}}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Come closer.</h1><p id="intro"></p></section></div>
 <div class="zw" id="zw"><div class="zs" id="zs"></div></div>
 <div class="pad"><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
zs.innerHTML=S.projects.map(p=>`<a class="zc" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <div class="face"><b>${p.t}</b></div><div class="in"><div class="k mono">${p.type}</div><p>${p.s}</p>
  <span class="go mono">Visit ↗</span></div></a>`).join("")+'<span class="hint">Keep scrolling</span>';
const cards=[...zs.querySelectorAll(".zc")],zw=document.getElementById("zw");
function frame(){const tr=zw.offsetHeight-innerHeight;
  const p=tr>0?Math.max(0,Math.min(1,-zw.getBoundingClientRect().top/tr)):0;
  const pos=p*cards.length;
  cards.forEach((c,i)=>{const d=pos-i;                 // <0 ahead, >0 passed
    const sc=Math.pow(2,d*1.5);
    c.style.transform=`scale(${sc.toFixed(3)})`;
    c.style.opacity=String(d<-1.1?0:d>0.75?Math.max(0,1-(d-0.75)*3):1);
    c.style.zIndex=String(10+Math.round(d*10));
    c.style.pointerEvents=Math.abs(d)<0.4?"auto":"none";});
}
addEventListener("scroll",frame,{passive:true});addEventListener("resize",frame);frame();
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d61t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("61");
</script></body></html>
