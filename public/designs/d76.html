<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D76 — Menu</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--card:#fdfaf1}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--card:#141209}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Inter,system-ui,sans-serif}
.pad{width:min(100% - 20px,720px);padding:52px 0 110px}
/* A restaurant menu: centred rules, leader dots to the price, courses instead
   of sections. The "price" is what the thing is. */
.card{background:var(--card);border:1px solid var(--line);padding:38px 26px 44px;text-align:center;
  box-shadow:0 16px 44px rgba(0,0,0,.12)}
.card h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(30px,7vw,58px);letter-spacing:.02em}
.card .sub{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-top:9px}
.card .lead{color:var(--dim);font-size:14.5px;line-height:1.7;max-width:44ch;margin:18px auto 0}
.rule{display:flex;align-items:center;gap:12px;margin:30px 0 22px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--line)}
.rule span{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.26em;text-transform:uppercase}
.dish{display:block;text-decoration:none;color:inherit;text-align:left;margin-bottom:20px}
.dish .top{display:flex;align-items:baseline;gap:8px}
.dish .n{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:21px;white-space:nowrap}
.dish .dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.dish .pr{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.dish p{color:var(--dim);font-size:13.5px;line-height:1.62;margin-top:5px}
.dish .ing{font-family:"DM Mono",monospace;font-size:11px;color:var(--dim);margin-top:4px}
.foot{margin-top:8px;font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.wa{display:inline-block;margin-top:16px;background:var(--ink);color:var(--card);text-decoration:none;
  padding:13px 20px;font-size:13.5px;font-weight:600}
#tt{position:fixed;top:14px;right:14px;z-index:60;background:none;border:1px solid var(--line);color:var(--gold);
  font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;cursor:pointer}
</style></head><body>
<button id="tt">Dark</button><div class="pad"><div class="card">
  <h1 id="nb"></h1><div class="sub">Web development — India</div>
  <p class="lead" id="intro"></p>
  <div class="rule"><span>Mains</span></div><div id="mains"></div>
  <div class="rule"><span>Sides</span></div><div id="sides"></div>
  <div class="rule"><span>Pantry</span></div><div class="foot" id="chips"></div>
  <div class="rule"><span>Reservations</span></div>
  <a class="wa" id="wa" href="#">Message me on WhatsApp</a>
 </div></div><div style="display:none"><div id="svc"></div></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
mains.innerHTML=S.projects.map(p=>`<a class="dish" href="${p.href}" target="_blank" rel="noreferrer">
  <span class="top"><span class="n">${p.t}</span><span class="dots"></span><span class="pr">Live ↗</span></span>
  <p>${p.s}</p><div class="ing">${p.stack.join(" · ")}</div></a>`).join("");
sides.innerHTML=S.services.map(s=>`<div class="dish">
  <span class="top"><span class="n">${s.t}</span><span class="dots"></span><span class="pr">Enquire</span></span>
  <p>${s.b}</p></div>`).join("");
chips.textContent=S.skills.join(" · ");
const root = document.documentElement;
const KEY = "d76t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("76");
</script></body></html>
