<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D60 — Status Board</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--ok:#4e7a20;--card:#fbf8ef}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--ok:#8ec46f;--card:#131109}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:"IBM Plex Sans",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",monospace}
/* An uptime board. Every project reports "operational", which is the single
   most persuasive fact about them and usually the one buried in a paragraph. */
.overall{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);margin-top:4vh}
.overall i{width:11px;height:11px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(78,122,32,.5);animation:p 2.4s infinite}
@keyframes p{70%{box-shadow:0 0 0 12px rgba(78,122,32,0)}100%{box-shadow:0 0 0 0 rgba(78,122,32,0)}}
.overall b{font-size:16px;font-weight:600}
.overall span{margin-left:auto;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.svcs{margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.srv{display:grid;grid-template-columns:1fr;gap:8px;padding:15px 18px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.srv:last-child{border-bottom:0}
@media(min-width:760px){.srv{grid-template-columns:1fr 190px 92px;align-items:center;gap:18px}}
.srv:hover{background:rgba(125,95,16,.05)}
.srv .n{font-weight:600;font-size:16px}
.srv .d{color:var(--dim);font-size:12.5px;line-height:1.55;margin-top:3px}
.srv .bars{display:flex;gap:2px;align-items:flex-end;height:24px}
.srv .bars i{flex:1;background:var(--ok);border-radius:1px;opacity:.85}
.srv .st{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok)}
.srv .st b{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.legend{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:9px}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Everything<br>operational.</h1><p id="intro"></p></section>
 <div class="overall"><i></i><b>All systems live</b><span id="upd"></span></div>
 <div class="svcs" id="svcs"></div>
 <div class="legend"><span>Five services</span><span>Uptime — since launch</span></div>
 <section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
upd.textContent="Updated just now";
svcs.innerHTML=S.projects.map(p=>`<a class="srv" href="${p.href}" target="_blank" rel="noreferrer">
  <div><div class="n">${p.t}</div><div class="d">${p.type} — ${p.s}</div></div>
  <div class="bars">${Array.from({length:26},(_,i)=>`<i style="height:${13+((p.t.charCodeAt(i%p.t.length)*3+i*5)%11)}px"></i>`).join("")}</div>
  <div class="st mono"><b></b>Live</div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d60t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("60");
</script></body></html>
