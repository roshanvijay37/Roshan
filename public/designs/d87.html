<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D87 — Seed Packet</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--paper:#f7f0dc}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--paper:#16130c}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
.hero h1{font-family:"Abril Fatface",Georgia,serif;font-weight:400;font-size:clamp(34px,9vw,96px);letter-spacing:-.01em;line-height:1}
/* Botanical seed packets — arched titles, "sowing instructions", a scalloped
   top edge. Every project is something you plant and it grows. */
.rack{display:grid;gap:18px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:660px){.rack{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.rack{grid-template-columns:repeat(3,1fr)}}
.pk{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;text-decoration:none;color:inherit;
  box-shadow:0 10px 26px rgba(0,0,0,.12);transition:.28s;position:relative}
.pk::before{content:"";display:block;height:12px;
  background:radial-gradient(circle at 8px -3px,transparent 7px,var(--paper) 8px) 0 0/16px 12px repeat-x;
  border-bottom:1px dashed var(--line)}
.pk:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.2)}
.pk .ill{height:150px;background:var(--c);display:grid;place-items:center;padding:14px;position:relative}
.pk .ill::after{content:"";position:absolute;inset:9px;border:1.5px solid rgba(255,255,255,.42);border-radius:3px}
.pk .ill b{font-family:"Abril Fatface",serif;color:rgba(255,255,255,.97);font-size:25px;text-align:center;line-height:1.08}
.pk .in{padding:14px 15px 18px}
.pk .k{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.pk h3{font-family:"Abril Fatface",serif;font-size:21px;margin:7px 0 6px;line-height:1.1}
.pk p{color:var(--dim);font-size:13px;line-height:1.6}
.pk .sow{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-family:"DM Mono",monospace;
  font-size:10.5px;color:var(--dim);line-height:1.7}
.pk .sow b{color:var(--ink);font-weight:500}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Things I<br>planted.</h1><p id="intro"></p></section>
 <div class="rack" id="rack"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
rack.innerHTML=S.projects.map(p=>`<a class="pk" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <div class="ill"><b>${p.t}</b></div>
  <div class="in"><div class="k">${p.type}</div><h3>${p.t}</h3><p>${p.s}</p>
   <div class="sow"><b>Sown with</b> ${p.stack.join(", ")}<br><b>Now</b> growing at ${p.href.replace("https://","")}</div></div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d87t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("87");
</script></body></html>
