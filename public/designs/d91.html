<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D91 — Audio Guide</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--card:#faf6ec}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--card:#141109}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:Inter,system-ui,sans-serif}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(36px,9vw,98px);letter-spacing:-.02em;line-height:1}
/* A museum audio guide: punch a stop number, hear about that piece. The number
   is the whole interface, and the transcript is the copy. */
.guide{display:grid;gap:16px;margin-top:4vh}
@media(min-width:860px){.guide{grid-template-columns:230px 1fr;align-items:start}}
.keypad{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.disp{border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;font-family:"DM Mono",monospace;
  font-size:26px;letter-spacing:.18em;color:var(--gold);background:rgba(0,0,0,.05)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.keys button{background:none;border:1px solid var(--line);color:var(--ink);font-family:"DM Mono",monospace;
  font-size:16px;padding:13px 0;border-radius:8px;cursor:pointer}
.keys button:hover{border-color:var(--gold);color:var(--gold)}
.stop{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px 26px;border-left:5px solid var(--c)}
.stop .k{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.stop h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(24px,5vw,42px);margin:9px 0 12px;line-height:1.05}
.stop p{color:var(--dim);font-size:15px;line-height:1.76;max-width:54ch}
.stop .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.stop .st span{font-family:"DM Mono",monospace;font-size:10px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--dim)}
.stop a{display:inline-block;margin-top:16px;color:var(--gold);font-family:"DM Mono",monospace;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.idx{margin-top:5vh;display:flex;flex-wrap:wrap;gap:8px}
.idx button{background:none;border:1px solid var(--line);color:var(--dim);font-family:"DM Mono",monospace;
  font-size:12px;padding:9px 13px;border-radius:99px;cursor:pointer}
.idx button.on{background:var(--c2);color:#fff;border-color:transparent}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Stop one.</h1><p id="intro"></p></section>
 <div class="guide"><div class="keypad"><div class="disp" id="disp">—</div><div class="keys" id="keys"></div></div>
  <div class="stop" id="stopcard"></div></div>
 <div class="idx" id="idx"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
keys.innerHTML=["1","2","3","4","5","⌫"].map(k=>`<button data-k="${k}">${k}</button>`).join("");
idx.innerHTML=S.projects.map((p,i)=>`<button data-i="${i}">${String(i+1).padStart(2,"0")} · ${p.t}</button>`).join("");
function play(i){const p=S.projects[i];
  disp.textContent=String(i+1).padStart(2,"0");
  stopcard.style.setProperty("--c",p.c);
  stopcard.innerHTML=`<div class="k">Stop ${String(i+1).padStart(2,"0")} — ${p.type}</div><h3>${p.t}</h3><p>${p.s}</p>
   <div class="st">${p.stack.map(x=>`<span>${x}</span>`).join("")}</div>
   <a href="${p.href}" target="_blank" rel="noreferrer">Visit ${p.href.replace("https://","")} ↗</a>`;
  idx.querySelectorAll("button").forEach((b,n)=>{b.classList.toggle("on",n===i);b.style.setProperty("--c2",S.projects[n].c)});}
keys.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  const k=b.dataset.k; if(k==="⌫"){disp.textContent="—";return}
  const i=+k-1; if(S.projects[i])play(i);});
idx.querySelectorAll("button").forEach(b=>b.onclick=()=>play(+b.dataset.i));
play(0);
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d91t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("91");
</script></body></html>
