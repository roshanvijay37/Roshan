<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D33 — Contact Sheet</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#161613;--ink:#eeeade;--gold:#e6c374;--dim:#8d8878;--line:rgba(238,234,222,.2);--film:#0e0e0c}
:root[data-theme="light"]{--bg:#eceadf;--ink:#16150f;--gold:#7d5f10;--dim:#666052;--line:rgba(22,21,15,.2);--film:#dedbcd}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}
body{font-family:Inter,system-ui,sans-serif}
nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}
.hero{padding:19vh 0 5vh}
.hero h1{font-weight:700;font-size:clamp(34px,8.4vw,92px);letter-spacing:-.045em;line-height:.96}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin-top:20px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
/* A photographer's contact sheet: frames on a strip with sprocket holes and
   grease-pencil marks on the ones worth printing. */
.strip{background:var(--film);border-radius:5px;padding:16px 10px;margin:5vh 0;position:relative}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:9px;
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,var(--bg) 9px 16px);opacity:.5}
.strip::before{top:3px}.strip::after{bottom:3px}
.frames{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:760px){.frames{grid-template-columns:repeat(3,1fr)}}
.fr{position:relative;aspect-ratio:3/2;background:var(--c);display:grid;place-items:center;
  text-decoration:none;overflow:hidden;transition:.3s}
.fr:hover{outline:3px solid var(--gold);outline-offset:-3px}
.fr b{color:rgba(255,255,255,.95);font-weight:700;font-size:clamp(15px,2.6vw,22px);letter-spacing:-.02em;text-align:center;padding:0 10px}
.fr .no{position:absolute;top:6px;left:8px;font-size:9.5px;color:rgba(255,255,255,.72);letter-spacing:.14em}
.fr .pick{position:absolute;inset:6px;border:2px solid var(--gold);opacity:0;transition:.3s}
.fr:hover .pick{opacity:1}
.meta{display:grid;grid-template-columns:1fr;gap:0;margin-top:5vh}
.mrow{display:grid;grid-template-columns:1fr;gap:4px;padding:16px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
@media(min-width:720px){.mrow{grid-template-columns:150px 1fr 130px;gap:18px;align-items:baseline}}
.mrow .n{font-weight:700;font-size:19px;letter-spacing:-.02em}
.mrow p{color:var(--dim);font-size:13.5px;line-height:1.62}
.mrow .g{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.sec{padding:9vh 0}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0}
.sv h4{font-weight:700;font-size:18px}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;color:var(--dim)}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;padding:15px 22px;font-weight:700;font-size:14px;border-radius:3px}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad">
  <section class="hero"><h1>Every frame<br><em>a live site.</em></h1><p id="intro"></p></section>
  <div class="strip"><div class="frames" id="frames"></div></div>
  <div class="meta" id="meta"></div>
  <section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
    <div class="chips" id="chips"></div></section>
  <section class="sec"><h2 style="font-weight:700;font-size:clamp(24px,5.4vw,48px);letter-spacing:-.04em">Have an idea?</h2>
    <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section>
</div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
frames.innerHTML=S.projects.map((p,i)=>`<a class="fr" href="${p.href}" target="_blank" rel="noreferrer" style="background:${p.c}">
  <span class="no mono">${String(i+1).padStart(2,"0")}</span><b>${p.t}</b><span class="pick"></span></a>`).join("");
meta.innerHTML=S.projects.map(p=>`<a class="mrow" href="${p.href}" target="_blank" rel="noreferrer">
  <div class="n">${p.t}</div><p>${p.s}</p><div class="g mono">${p.type} ↗</div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d33t", ALT = "light";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Dark" : "Light"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("33");
</script></body></html>
