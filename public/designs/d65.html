<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D65 — Drag Gallery</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;900&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
body{font-family:"Schibsted Grotesk",system-ui,sans-serif}
/* A rail you throw rather than scroll: momentum, friction, and it snaps to
   nothing — you land where you flick it. */
.railwrap{margin-top:4vh;overflow:hidden;cursor:grab;user-select:none}
.railwrap.drag{cursor:grabbing}
.rail{display:flex;gap:16px;will-change:transform;padding:4px 0 18px}
.it{flex:none;width:min(78vw,340px);border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:var(--bg);text-decoration:none;color:inherit}
.it .face{aspect-ratio:4/3;background:var(--c);display:grid;place-items:center;padding:16px}
.it .face b{color:rgba(255,255,255,.96);font-weight:900;font-size:clamp(19px,3.6vw,30px);letter-spacing:-.03em;text-align:center}
.it .in{padding:14px 15px 18px}
.it .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.it h3{font-weight:900;font-size:21px;letter-spacing:-.03em;margin:7px 0 6px}
.it p{color:var(--dim);font-size:13px;line-height:1.6}
.it .go{display:inline-block;margin-top:10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.meter{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--gold);width:22%}
.hint{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:10px}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Throw it.</h1><p id="intro"></p></section>
 <div class="railwrap" id="rw"><div class="rail" id="rail"></div></div>
 <div class="meter"><i id="mi"></i></div><div class="hint">Drag or flick — it keeps going</div>
 <section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
rail.innerHTML=S.projects.map(p=>`<a class="it" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <div class="face"><b>${p.t}</b></div><div class="in"><div class="k mono">${p.type}</div>
  <h3>${p.t}</h3><p>${p.s}</p><span class="go mono">Visit ↗</span></div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const rw=document.getElementById("rw");
let x=0,v=0,down=false,lx=0,moved=0;
const max=()=>Math.min(0,rw.clientWidth-rail.scrollWidth);
function apply(){x=Math.max(max(),Math.min(0,x));rail.style.transform=`translateX(${x}px)`;
  mi.style.width=(max()?Math.max(6,(x/max())*100):100)+"%";}
rw.addEventListener("pointerdown",e=>{down=true;moved=0;lx=e.clientX;v=0;rw.classList.add("drag");rw.setPointerCapture(e.pointerId)});
rw.addEventListener("pointermove",e=>{if(!down)return;const d=e.clientX-lx;lx=e.clientX;x+=d;v=d;moved+=Math.abs(d);apply()});
const up=()=>{down=false;rw.classList.remove("drag")};
rw.addEventListener("pointerup",up);rw.addEventListener("pointercancel",up);
// a flick that ends on a card must not open it
rw.addEventListener("click",e=>{if(moved>8){e.preventDefault();e.stopPropagation()}},true);
(function glide(){if(!down&&Math.abs(v)>.1){x+=v;v*=.94;apply()}requestAnimationFrame(glide)})();
addEventListener("resize",apply);apply();
const root = document.documentElement;
const KEY = "d65t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("65");
</script></body></html>
