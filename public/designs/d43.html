<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D43 — Chapters</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Inter,system-ui,sans-serif}
.hero{min-height:86svh;display:grid;align-content:center;padding:19vh 0 6vh}
.hero .k{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.hero h1{font-family:Lora,Georgia,serif;font-weight:700;font-size:clamp(34px,8.6vw,96px);letter-spacing:-.03em;line-height:1.02}
.hero p{margin-top:20px;max-width:48ch;color:var(--dim);line-height:1.8;font-size:16px}
/* Told as chapters. The chapter title pins while its story scrolls past, so the
   reader always knows which part of the argument they are in. */
.chap{position:relative;min-height:150vh;border-top:1px solid var(--line)}
.chead{position:sticky;top:0;padding:14vh 0 4vh;background:linear-gradient(var(--bg) 68%,transparent)}
.chead .n{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.chead h2{font-family:Lora,serif;font-weight:700;font-size:clamp(28px,6.4vw,64px);letter-spacing:-.03em;margin-top:9px;line-height:1.04}
.cbody{padding:2vh 0 16vh;max-width:56ch}
.cbody p{font-size:16.5px;line-height:1.82;color:var(--dim);margin-bottom:20px}
.cbody .band{height:8px;background:var(--c);margin:8px 0 22px}
.cbody .st{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cbody .st span{font-size:10px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--dim)}
.cbody a{color:var(--gold);font-size:11px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
.prog{position:fixed;left:0;top:0;height:3px;background:var(--gold);z-index:70;width:0}
</style></head><body>
<div class="prog" id="prog"></div><nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad">
 <section class="hero"><div class="k mono">Freelance web developer</div>
  <h1>Five chapters,<br>all of them shipped.</h1><p id="intro"></p></section>
 <div id="chaps"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
chaps.innerHTML=S.projects.map((p,i)=>`<section class="chap" style="--c:${p.c}">
  <div class="chead"><div class="n mono">Chapter ${["one","two","three","four","five"][i]} — ${p.type}</div><h2>${p.t}</h2></div>
  <div class="cbody"><div class="band"></div><p>${p.s}</p>
   <div class="st">${p.stack.map(x=>`<span class="mono">${x}</span>`).join("")}</div>
   <a class="mono" href="${p.href}" target="_blank" rel="noreferrer">Visit ${p.href.replace("https://","")} ↗</a></div></section>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
addEventListener("scroll",()=>{const h=document.documentElement;
  prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100||0)+"%";},{passive:true});
const root = document.documentElement;
const KEY = "d43t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("43");
</script></body></html>
