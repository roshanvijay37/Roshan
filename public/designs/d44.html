<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D44 — Poster Grid</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Inter,system-ui,sans-serif}
.hero{padding:18vh 0 4vh}
.hero h1{font-family:Syne,system-ui,sans-serif;font-weight:800;font-size:clamp(32px,8vw,88px);letter-spacing:-.045em;line-height:.98}
.hero p{margin-top:18px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
/* Posters pinned to a grid, each a different height so the wall has rhythm.
   Masonry via columns, which reflows without JS. */
.wall{columns:1;column-gap:16px;padding:4vh 0}
@media(min-width:660px){.wall{columns:2}}
@media(min-width:1000px){.wall{columns:3}}
.po{break-inside:avoid;margin-bottom:16px;text-decoration:none;color:inherit;display:block;
  border-radius:10px;overflow:hidden;border:1px solid var(--line);transition:.3s}
.po:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.16)}
.po .face{background:var(--c);display:grid;place-items:center;padding:22px;text-align:center}
.po .face b{font-family:Syne,sans-serif;font-weight:800;color:rgba(255,255,255,.96);font-size:clamp(20px,3.6vw,32px);letter-spacing:-.03em;line-height:1.05}
.po .in{padding:14px 15px 18px}
.po .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.po p{color:var(--dim);font-size:13px;line-height:1.62;margin-top:8px}
.po .go{display:inline-block;margin-top:10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>A wall of<br>working sites.</h1><p id="intro"></p></section>
 <div class="wall" id="wall"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
const H=[210,150,265,175,225];
wall.innerHTML=S.projects.map((p,i)=>`<a class="po" href="${p.href}" target="_blank" rel="noreferrer">
  <div class="face" style="--c:${p.c};min-height:${H[i%H.length]}px"><b>${p.t}</b></div>
  <div class="in"><div class="k mono">${p.type}</div><p>${p.s}</p><span class="go mono">Visit ↗</span></div></a>`).join("");
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d44t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("44");
</script></body></html>
