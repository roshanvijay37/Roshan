<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D54 — Wireframe</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Inter,system-ui,sans-serif}
/* A switch between the sketch and the finished thing. Showing the wireframe is
   showing the thinking, which is what a client is actually buying. */
.hero{padding:18vh 0 3vh}
.hero h1{font-weight:700;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:16px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:22px}
.tog button{background:none;border:0;color:var(--dim);font:inherit;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:10px 16px;cursor:pointer}
.tog button.on{background:var(--ink);color:var(--bg)}
.list{margin-top:5vh}
.pj{border-top:1px solid var(--line);padding:26px 0;display:grid;gap:18px}
@media(min-width:880px){.pj{grid-template-columns:1fr 1fr;gap:34px;align-items:center}}
.vis{aspect-ratio:16/11;border-radius:10px;overflow:hidden;position:relative;background:var(--c);display:grid;place-items:center}
.vis b{color:rgba(255,255,255,.96);font-weight:700;font-size:clamp(21px,4vw,36px);letter-spacing:-.03em}
/* the wireframe layer is drawn, not an image — boxes and rules like a sketch */
.wf{position:absolute;inset:0;background:var(--bg);opacity:0;transition:opacity .45s;
  padding:12px;display:grid;grid-template-rows:auto 1fr auto;gap:8px}
body.wire .wf{opacity:1}
.wf .bar2{height:16px;border:1.5px dashed var(--line);border-radius:3px}
.wf .body2{border:1.5px dashed var(--line);border-radius:3px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.wf .body2 div{border:1.5px dashed var(--line);border-radius:3px;position:relative}
.wf .body2 div::after{content:"";position:absolute;left:8%;right:8%;top:22%;height:2px;background:var(--line)}
.wf .foot2{height:14px;border:1.5px dashed var(--line);border-radius:3px}
.wf .tag{position:absolute;top:8px;right:10px;font-family:"DM Mono",monospace;font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.info .k{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.info h3{font-weight:700;font-size:clamp(22px,4.4vw,36px);letter-spacing:-.035em;margin:8px 0 10px}
.info p{color:var(--dim);font-size:14.5px;line-height:1.7}
.info .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.info .st span{font-size:10px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--dim)}
.info a{display:inline-block;margin-top:14px;color:var(--gold);font-size:11px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>The sketch,<br>and the thing.</h1><p id="intro"></p>
  <div class="tog"><button id="bw" class="on">Wireframe</button><button id="bd">Built</button></div></section>
 <div class="list" id="list"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
list.innerHTML=S.projects.map(p=>`<div class="pj">
  <div class="vis" style="--c:${p.c}"><b>${p.t}</b>
   <div class="wf"><div class="bar2"></div><div class="body2"><div></div><div></div><div></div><div></div></div>
    <div class="foot2"></div><span class="tag">wireframe</span></div></div>
  <div class="info"><div class="k mono">${p.type}</div><h3>${p.t}</h3><p>${p.s}</p>
   <div class="st">${p.stack.map(x=>`<span class="mono">${x}</span>`).join("")}</div>
   <a class="mono" href="${p.href}" target="_blank" rel="noreferrer">Visit ${p.href.replace("https://","")} ↗</a></div></div>`).join("");
document.body.classList.add("wire");
bw.onclick=()=>{document.body.classList.add("wire");bw.classList.add("on");bd.classList.remove("on")};
bd.onclick=()=>{document.body.classList.remove("wire");bd.classList.add("on");bw.classList.remove("on")};
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d54t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("54");
</script></body></html>
