<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D55 — Player</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0c0a;--panel:#17150f;--ink:#f0ebe0;--gold:#e6c374;--dim:#8e8878;--line:rgba(240,235,224,.14)}
:root[data-theme="light"]{--bg:#f4f1e8;--panel:#eae5d7;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}
.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:Inter,system-ui,sans-serif}
.pad{padding:74px 0 12vh;width:min(100% - 22px,820px)}
/* A track list, because the first project on it is a voice product. The
   waveform is drawn from the project name, so each bar pattern is its own. */
.head{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.art{width:132px;height:132px;border-radius:10px;background:linear-gradient(140deg,var(--gold),#8a6a14);
  display:grid;place-items:center;color:#13100a;font-weight:700;font-size:34px;flex:none}
.head .m .k{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.head .m h1{font-weight:700;font-size:clamp(26px,6vw,54px);letter-spacing:-.04em;margin:7px 0 6px;line-height:1.02}
.head .m p{color:var(--dim);font-size:14px;line-height:1.66;max-width:44ch}
.tracks{margin-top:6vh;border-top:1px solid var(--line)}
.tr{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;padding:13px 0;
  border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.tr:hover{background:rgba(230,195,116,.05)}
.tr .n{color:var(--dim);font-family:"DM Mono",monospace;font-size:12px}
.tr .t{font-weight:600;font-size:16px;letter-spacing:-.02em}
.tr .s{color:var(--dim);font-size:12.5px;margin-top:3px;line-height:1.5}
.tr .wave{display:flex;gap:2px;align-items:flex-end;height:26px;margin-top:7px}
.tr .wave i{width:2.5px;background:var(--c);border-radius:2px;opacity:.75}
.tr .go{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 14px 14px}
.bar .sq{width:40px;height:40px;border-radius:6px;background:var(--c);flex:none}
.bar .info{flex:1;min-width:0}
.bar .info b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .info span{font-size:11px;color:var(--dim)}
.bar a{background:var(--gold);color:#13100a;text-decoration:none;padding:10px 14px;border-radius:99px;font-weight:700;font-size:12.5px;white-space:nowrap}
#tt{position:fixed;top:14px;right:14px;z-index:60;background:none;border:1px solid var(--line);color:var(--gold);
  font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}
</style></head><body>
<button id="tt">Light</button><div class="pad">
  <div class="head"><div class="art">R</div><div class="m"><div class="k mono">Portfolio — five tracks</div>
   <h1 id="nb"></h1><p id="intro"></p></div></div>
  <div class="tracks" id="tracks"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
 <div class="bar" id="bar"></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
// bars derived from the name, so every waveform is unique but stable
const wave=t=>Array.from({length:34},(_,i)=>{
  const c=t.charCodeAt(i%t.length); return 5+((c*7+i*13)%20);});
tracks.innerHTML=S.projects.map((p,i)=>`<a class="tr" href="${p.href}" target="_blank" rel="noreferrer" style="--c:${p.c}">
  <span class="n">${String(i+1).padStart(2,"0")}</span>
  <span><span class="t">${p.t}</span><span class="s">${p.type} — ${p.s}</span>
   <span class="wave">${wave(p.t).map(h=>`<i style="height:${h}px"></i>`).join("")}</span></span>
  <span class="go">Play ↗</span></a>`).join("");
const f=S.projects[0];
bar.innerHTML=`<span class="sq" style="--c:${f.c}"></span>
 <span class="info"><b>Now: ${f.t}</b><span>${f.type}</span></span>
 <a href="${S.wa}" target="_blank" rel="noreferrer">Message me →</a>`;
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d55t", ALT = "light";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Dark" : "Light"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("55");
</script></body></html>
