<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D48 — Shelf</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#141109;--gold:#7d5f10;--dim:#6a6353;--line:rgba(20,17,9,.15);--wood:#c9b48d}
:root[data-theme="dark"]{--bg:#0b0a07;--ink:#f0eade;--gold:#e6c374;--dim:#8e8776;--line:rgba(240,234,222,.15)}
:root[data-theme="dark"]{--wood:#2a2318}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}
body{color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.pad{width:min(100% - 26px,1160px);margin:auto}nav{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  background:linear-gradient(180deg,var(--bg),transparent)}
nav b{color:var(--gold)}
nav button{background:none;border:1px solid var(--line);color:var(--gold);font:inherit;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:6px 11px;cursor:pointer}.grid{display:grid;gap:14px;grid-template-columns:1fr;margin-top:4vh}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.sv{border-top:1px solid var(--line);padding:15px 0 19px}
.sv h4{font-weight:700;font-size:18px;letter-spacing:-.02em}
.sv p{color:var(--dim);font-size:13.5px;line-height:1.66;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chips span{font-size:10.5px;border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--dim)}
.lab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.sec{padding:9vh 0}.btn{display:inline-block;margin-top:20px;background:var(--gold);color:#141005;text-decoration:none;
  padding:15px 23px;border-radius:99px;font-weight:700;font-size:14px}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.hero{padding:18vh 0 3vh}
.hero h1{font-weight:800;font-size:clamp(30px,7.6vw,80px);letter-spacing:-.045em;line-height:1.02}
.hero p{margin-top:18px;max-width:46ch;color:var(--dim);line-height:1.75;font-size:15px}
/* Spines on a shelf. Standing books you tilt out to read — the closed state
   shows five at once, which a stack of cards never does. */
.shelf{display:flex;gap:8px;align-items:flex-end;padding:6vh 0 0;overflow-x:auto;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.spine{flex:none;width:58px;height:min(46vh,340px);background:var(--c);border-radius:5px 5px 0 0;
  writing-mode:vertical-rl;text-orientation:mixed;color:rgba(255,255,255,.96);font-weight:800;
  font-size:15px;letter-spacing:-.01em;padding:14px 0;display:flex;align-items:center;justify-content:center;
  border:0;cursor:pointer;transition:transform .35s,filter .35s;transform-origin:bottom center}
.spine.on{transform:rotate(-7deg) translateY(-8px);filter:brightness(1.12)}
.board{height:12px;background:var(--wood);border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.open{margin-top:26px;border:1px solid var(--line);border-radius:12px;padding:20px 20px 24px;background:var(--bg)}
.open .k{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.open h3{font-weight:800;font-size:clamp(23px,5vw,42px);letter-spacing:-.04em;margin:9px 0 10px;line-height:1.03}
.open p{color:var(--dim);font-size:15px;line-height:1.72;max-width:54ch}
.open .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
.open .st span{font-size:10px;border:1px solid var(--line);padding:6px 9px;border-radius:99px;color:var(--dim)}
.open a{display:inline-block;margin-top:15px;background:var(--ink);color:var(--bg);text-decoration:none;
  padding:13px 19px;border-radius:99px;font-weight:700;font-size:13.5px}
</style></head><body>
<nav><b id="nb"></b><span style="display:flex;gap:10px;align-items:center"><button id="tt">Dark</button></span></nav><div class="pad"><section class="hero"><h1>Pull one<br>off the shelf.</h1><p id="intro"></p></section>
 <div class="shelf" id="shelf"></div><div class="board"></div>
 <div class="open" id="open"></div><section class="sec"><div class="lab mono">Services</div><div class="grid" id="svc"></div>
  <div class="chips" id="chips"></div></section><section class="sec"><h2 style="font-weight:700;font-size:clamp(26px,6vw,58px);letter-spacing:-.04em">Have an idea?</h2>
  <a class="btn" id="wa" href="#">Message me on WhatsApp →</a></section></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent=S.name; if(window.intro)intro.textContent=S.intro; if(window.wa)wa.href=S.wa;
shelf.innerHTML=S.projects.map((p,i)=>`<button class="spine${i===0?" on":""}" data-i="${i}" style="--c:${p.c};background:${p.c}">${p.t}</button>`).join("");
function pick(i){const p=S.projects[i];
  shelf.querySelectorAll(".spine").forEach((s,x)=>s.classList.toggle("on",x===i));
  open.innerHTML=`<div class="k mono">${p.type} — ${p.href.replace("https://","")}</div><h3>${p.t}</h3><p>${p.s}</p>
   <div class="st">${p.stack.map(x=>`<span class="mono">${x}</span>`).join("")}</div>
   <a href="${p.href}" target="_blank" rel="noreferrer">Visit live site ↗</a>`;}
shelf.querySelectorAll(".spine").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
pick(0);
svc.innerHTML=S.services.map(s=>`<div class="sv"><h4>${s.t}</h4><p>${s.b}</p></div>`).join("");
chips.innerHTML=S.skills.map(t=>`<span class="mono">${t}</span>`).join("");
const root = document.documentElement;
const KEY = "d48t", ALT = "dark";
try { if (localStorage.getItem(KEY) === ALT) root.setAttribute("data-theme", ALT); } catch {}
const paint = () => { const el = document.getElementById("tt"); if (el) el.textContent = root.getAttribute("data-theme") === ALT ? "Light" : "Dark"; };
paint();
{ const el = document.getElementById("tt"); if (el) el.onclick = () => {
  const on = root.getAttribute("data-theme") === ALT;
  if (on) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", ALT);
  try { localStorage.setItem(KEY, on ? "off" : ALT); } catch {}
  paint(); }; }
window.switcher("48");
</script></body></html>
