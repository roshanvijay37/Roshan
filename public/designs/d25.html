<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D25 — Desktop</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--desk:#8a7f63;--panel:#efeade;--ink:#15120b;--gold:#7d5f10;--dim:#6a6353;--line:rgba(21,18,11,.18)}
:root[data-theme="dark"]{--desk:#1a1712;--panel:#14120d;--ink:#eee8da;--gold:#e6c374;--dim:#8e8776;--line:rgba(238,232,218,.16)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--desk);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px}
.mono{font-family:"DM Mono",ui-monospace,monospace}
/* Windows you can pick up and move. Every other direction is a page; this one
   is a room. Tapping a dock icon brings its window to the front. */
#desk{position:fixed;inset:0}
/* Position as a fraction of the space LEFT OVER after the window width, so a
   window can never extend past the edge — at any viewport, with no measuring.
   Measuring could not work here: the overflow made the mobile layout viewport
   expand, so innerWidth reported the overflowed width and the clamp agreed
   with it. */
.win{position:absolute;width:min(88vw,420px);
  left:calc((100% - min(88vw,420px)) * var(--f));
  top:calc(44px + (100% - 44px - min(76vh,520px)) * var(--g));background:var(--panel);border:1px solid var(--line);
  border-radius:9px;box-shadow:0 22px 60px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;max-height:76vh}
.tb{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--line);
  cursor:grab;user-select:none;background:linear-gradient(180deg,rgba(0,0,0,.045),transparent)}
.tb.drag{cursor:grabbing}
.tb i{width:9px;height:9px;border-radius:50%;background:rgba(130,124,106,.5)}
.tb .t{margin-left:6px;font-size:11.5px;color:var(--dim);letter-spacing:.05em}
.bd{padding:15px 16px 20px;overflow:auto;font-size:14px;line-height:1.65}
.bd h2{font-weight:700;font-size:21px;letter-spacing:-.025em;margin-bottom:8px}
.bd p{color:var(--dim);font-size:13.5px;line-height:1.68}
.bd .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.bd .band{height:80px;border-radius:6px;background:var(--c);display:grid;place-items:center;margin-bottom:12px}
.bd .band b{color:rgba(255,255,255,.95);font-weight:700;font-size:19px;letter-spacing:-.02em}
.bd .st{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
.bd .st span{font-size:10px;border:1px solid var(--line);padding:6px 8px;border-radius:99px;color:var(--dim)}
.bd a.go{display:inline-block;margin-top:12px;color:var(--gold);font-size:12.5px;font-weight:600;text-decoration:none}
.bd .wa{display:inline-block;margin-top:10px;background:var(--gold);color:#141005;text-decoration:none;
  padding:11px 16px;border-radius:7px;font-weight:700;font-size:13.5px}
.dock{position:fixed;z-index:200;left:50%;transform:translateX(-50%);bottom:56px;display:flex;gap:6px;
  padding:7px;background:rgba(20,17,11,.68);backdrop-filter:blur(16px);border-radius:14px;
  max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.dock button{background:none;border:0;color:#e9e3d3;font:inherit;font-size:11px;letter-spacing:.08em;
  padding:9px 11px;border-radius:9px;cursor:pointer;white-space:nowrap;font-family:"DM Mono",monospace}
.dock button:hover{background:rgba(255,255,255,.12)}
.dock button.on{background:var(--gold);color:#141005}
.top{position:fixed;z-index:200;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;background:rgba(20,17,11,.55);backdrop-filter:blur(14px);color:#ece6d6;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-family:"DM Mono",monospace}
.top button{background:none;border:1px solid rgba(255,255,255,.24);color:#e9c374;font:inherit;font-size:10px;
  border-radius:99px;padding:5px 10px;cursor:pointer}
</style></head><body>
<div class="top"><span id="nb"></span><span style="display:flex;gap:10px;align-items:center">Available <button id="tt">Dark</button></span></div>
<div id="desk"></div>
<div class="dock" id="dock"></div>
<script src="shared.js"></script>
<script>
const S = window.SITE;
nb.textContent = S.name;

const wins = [
  { id:"about", title:"about.txt", x:.06, y:.13, html:`<div class="k mono">Read me</div>
      <h2>${S.name}</h2><p>${S.intro}</p>
      <p style="margin-top:10px">Freelance, based in India. Everything in the work folder is live.</p>` },
  ...S.projects.map((p, i) => ({ id:"p"+i, title:p.t.toLowerCase().split(" ")[0]+".app",
    x:.12+i*.055, y:.2+i*.045, c:p.c,
    html:`<div class="band"><b>${p.t}</b></div><div class="k mono">${p.type}</div>
      <h2>${p.t}</h2><p>${p.s}</p>
      <div class="st">${p.stack.map(x=>`<span class="mono">${x}</span>`).join("")}</div>
      <a class="go" href="${p.href}" target="_blank" rel="noreferrer">Open ${p.href.replace("https://","")} ↗</a>` })),
  { id:"svc", title:"services.md", x:.46, y:.16, html:`<div class="k mono">Services</div>
      ${S.services.map(s=>`<h2 style="font-size:17px;margin-top:10px">${s.t}</h2><p>${s.b}</p>`).join("")}` },
  { id:"stack", title:"stack.json", x:.3, y:.44, html:`<div class="k mono">Built with</div>
      <div class="st">${S.skills.map(t=>`<span class="mono">${t}</span>`).join("")}</div>` },
  { id:"hire", title:"contact", x:.55, y:.5, html:`<div class="k mono">Contact</div><h2>Have an idea?</h2>
      <p>Fastest route is WhatsApp.</p><a class="wa" href="${S.wa}" target="_blank" rel="noreferrer">Message me →</a>` },
];

let z = 10;
const desk = document.getElementById("desk");
desk.innerHTML = wins.map(w => `
  <div class="win" id="w-${w.id}" style="--f:${w.x.toFixed(3)};--g:${w.y.toFixed(3)};${w.c?`--c:${w.c}`:""}">
    <div class="tb"><i></i><i></i><i></i><span class="t mono">${w.title}</span></div>
    <div class="bd">${w.html}</div></div>`).join("");

dock.innerHTML = wins.map(w => `<button data-w="${w.id}">${w.title}</button>`).join("");

function focus(id){
  const el = document.getElementById("w-" + id);
  el.style.zIndex = ++z;
  dock.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.w === id));
  const active = dock.querySelector("button.on"); if (active) active.scrollIntoView({inline:"center",block:"nearest"});
}
dock.querySelectorAll("button").forEach(b => b.onclick = () => focus(b.dataset.w));

// drag by the title bar; pointer events cover mouse and touch together
document.querySelectorAll(".win").forEach(win => {
  const tb = win.querySelector(".tb");
  let sx = 0, sy = 0, ox = 0, oy = 0, on = false;
  const start = e => { on = true; tb.classList.add("drag"); tb.setPointerCapture(e.pointerId);
    const r = win.getBoundingClientRect(); ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY;
    win.style.left = ox + "px"; win.style.top = oy + "px";
    focus(win.id.slice(2)); };
  const move = e => { if (!on) return;
    // keep the title bar reachable — a window dragged off-screen is unrecoverable
    const nx = Math.max(-win.offsetWidth + 90, Math.min(innerWidth - 60, ox + e.clientX - sx));
    const ny = Math.max(34, Math.min(innerHeight - 60, oy + e.clientY - sy));
    win.style.left = nx + "px"; win.style.top = ny + "px"; };
  const stop = () => { on = false; tb.classList.remove("drag"); };
  tb.addEventListener("pointerdown", start);
  tb.addEventListener("pointermove", move);
  tb.addEventListener("pointerup", stop);
  tb.addEventListener("pointercancel", stop);
  win.addEventListener("pointerdown", () => focus(win.id.slice(2)));
});
focus("about");

const root = document.documentElement;
try { if (localStorage.getItem("d25t") === "dark") root.setAttribute("data-theme","dark"); } catch {}
const paint = () => tt.textContent = root.getAttribute("data-theme") === "dark" ? "Light" : "Dark"; paint();
tt.onclick = () => { const d = root.getAttribute("data-theme") === "dark";
  if (d) root.removeAttribute("data-theme"); else root.setAttribute("data-theme","dark");
  try { localStorage.setItem("d25t", d ? "light" : "dark"); } catch {} paint(); };
window.switcher("25");
</script></body></html>
