<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kotha Reel</title>
<meta property="og:title" content="Kotha Reel">
<meta property="og:description" content="Procession reel cut to the King of Kotha theme">
<meta property="og:image" content="poster.jpg">
<meta property="og:type" content="video.other">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a07;--card:#151310;--ink:#f1ebdf;--gold:#e6c374;--dim:#8f8776;--line:rgba(241,235,223,.15)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  min-height:100svh;display:grid;place-items:start center;padding:26px 16px 54px}
.wrap{width:min(100%,430px);display:grid;gap:16px}
h1{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:7px}
.k{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
video{width:100%;max-height:72svh;aspect-ratio:9/16;object-fit:contain;display:block;
  border-radius:14px;border:1px solid var(--line);background:#000}
.actions{display:flex;gap:9px;flex-wrap:wrap}
a.btn{flex:1;text-align:center;background:var(--gold);color:#141005;text-decoration:none;
  padding:13px 16px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap}
a.ghost{background:none;border:1px solid var(--line);color:var(--gold)}
.meta{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-family:"DM Mono",monospace;
  font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:14px}
.meta b{color:var(--ink);font-weight:500;text-align:right}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px 16px}
.panel h2{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);font-weight:400;margin-bottom:9px}
.note{color:var(--dim);font-size:12.5px;line-height:1.65}
.note b{color:var(--ink);font-weight:500}
.note + .note{margin-top:9px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="k">Final · King of Kotha theme</div>
    <h1>Procession reel — 25 s</h1>
  </div>

  <video src="reel.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>

  <div class="actions">
    <a class="btn" href="reel.mp4" download="reel.mp4">Download</a>
    
  </div>

  <div class="meta">
    <span>Resolution</span><b>1080 &times; 1920</b>
    <span>Duration</span><b>25.5 s</b>
    <span>Frame rate</span><b>30 fps</b>
    <span>Music</span><b>King of Kotha Teaser Theme — 25 s edit</b>
    <span>Status</span><b>final — reviewed</b>
  </div>

  <div class="panel">
    <h2>Notes</h2>
    
  </div>
</div>
</body>
</html>
